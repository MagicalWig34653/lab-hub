# Lokale Entwicklung. Passwörter nie ins Repo: .env anlegen (siehe .env.example).
name: lab-hub-dev
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-labhub}
      POSTGRES_USER: ${DB_USER:-labhub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD in .env setzen}
    volumes:
      - lab-hub-dev-db:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-labhub} -d ${DB_NAME:-labhub}"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  lab-hub-dev-db:
