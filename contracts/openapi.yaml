  # --- WP-S1 Suche ---
  /api/v1/tenants/{tenant}/dms/search:
    get:
      operationId: searchDmsDocuments
      summary: Volltextsuche ueber Dokumente (Berechtigung dms.document.read); Papierkorb ausgeschlossen
      description: |
        PostgreSQL-Suche (ADR 0005): Titel, Metadaten (Korrespondent, Typ, Tags, Dateiname des Originals) und aktueller Text (deutsch/englisch, mit Wortstamm, ohne Umlautzwang).
        Leeres oder fehlendes q durchsucht ohne Suchbegriff (Durchsuchen): alle Dokumente des Mandanten ausser Papierkorb, neueste Eingaenge zuerst (score = Eingangszeit in Sekunden seit Epoche, snippet null),
        mit denselben Filtern (Datum, Typ, Ablagepfad, Korrespondent, mehrere Tags), Facetten, Zaehlung und Cursor-Pagination wie die Suche. Der Cursor gilt nur fuer dieselbe Anfrage.
        q folgt websearch_to_tsquery: Leerzeichen = und, "Phrase", or, -Ausschluss. Ohne Operatoren greift zusaetzlich ein Tippfehler-Fallback (pg_trgm) auf Titel und Metadaten; fuzzy=false schaltet ihn ab.
        Sortierung nach Relevanz (absteigend), Volltexttreffer (score >= 1) vor Tippfehler-Treffern (score < 1). Cursor-Pagination wie ueberall (der Cursor ist an dieselbe Anfrage gebunden).
        Treffer im snippet stehen zwischen U+E000 und U+E001 (private Zeichen, kein HTML; der Client escaped den Text selbst).
        Facetten (facets=true) zaehlen ueber die gesamte gefilterte Treffermenge, je Facette die haeufigsten 20 Werte.
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Count" }
        - { name: q, in: query, schema: { type: string, maxLength: 200 }, description: "Suchbegriff; leer oder weggelassen = Durchsuchen ohne Suchbegriff" }
        - { name: fuzzy, in: query, schema: { type: boolean, default: true }, description: "false schaltet den Tippfehler-Fallback ab" }
        - { name: facets, in: query, schema: { type: boolean, default: false } }
        - { name: document_type_id, in: query, schema: { type: string, format: uuid } }
        - { name: storage_path_id, in: query, schema: { type: string, format: uuid } }
        - { name: correspondent_id, in: query, schema: { type: string, format: uuid } }
        - { name: tag_id, in: query, schema: { type: string }, description: "Eine oder mehrere Tag-IDs, durch Komma getrennt (hoechstens 10); alle muessen zutreffen" }
        - { name: date_from, in: query, schema: { type: string, format: date }, description: "doc_date >= (inklusive)" }
        - { name: date_to, in: query, schema: { type: string, format: date }, description: "doc_date <= (inklusive)" }
      responses:
        "200":
          description: Trefferseite
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DmsSearchPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/tenants/{tenant}/dms/documents/{document}/retention:
    get:
      operationId: getDmsDocumentRetention
      summary: Aufbewahrungszustand eines Dokuments (Berechtigung dms.document.read)
      description: |
        Wirksames Fristende, Herkunft der Frist (Dokumenttyp, Standard, manuell), Loeschsperre und die Gruende, die ein endgueltiges Loeschen derzeit verhindern (blockers).
        Die Fristen sind eine konfigurierbare, GoBD-orientierte Voreinstellung (Ende des Kalenderjahres des Belegdatums plus Jahre je Dokumenttyp, sonst DMS_DEFAULT_RETENTION_YEARS, Standard 10); keine Rechtsberatung und keine Konformitaetszusage.
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
        - { $ref: "#/components/parameters/DmsDocument" }
      responses:
        "200": { description: Aufbewahrungszustand, content: { application/json: { schema: { $ref: "#/components/schemas/DmsRetention" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateDmsDocumentRetention
      summary: Loeschsperre setzen/aufheben und Frist verlaengern (Berechtigung dms.document.retention)
      description: Mindestens ein Feld. Die manuelle Frist kann nur verlaengern (Verkuerzen 422). Audit dms.document.retention_changed.
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
        - { $ref: "#/components/parameters/DmsDocument" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                legal_hold: { type: boolean }
                retention_until: { type: string, format: date }
      responses:
        "200": { description: Neuer Zustand, content: { application/json: { schema: { $ref: "#/components/schemas/DmsRetention" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/tenants/{tenant}/dms/documents/{document}/purge:
    post:
      operationId: purgeDmsDocument
      summary: Endgueltig loeschen (Berechtigung dms.document.purge, nur Owner)
      description: |
        Nur aus dem Papierkorb, nach Ablauf der Aufbewahrungsfrist, ohne Loeschsperre und ohne aktive Verknuepfung (z. B. von einem Beleg). Sonst 409 mit dem ersten Grund als Code
        (document_not_trashed, legal_hold, retention_not_expired, document_linked). Entfernt Metadaten, Text, Eingangsvorgaenge und Dateizeilen in einer Transaktion und schreibt das Loeschprotokoll
        (Hash des Originals, Zeitpunkt, Person; kein Titel); die Bytes im Objektspeicher werden nur geloescht, wenn keine Dateizeile des Mandanten mehr darauf zeigt. Audit dms.document.purged.
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
        - { $ref: "#/components/parameters/DmsDocument" }
      responses:
        "200": { description: Geloescht, content: { application/json: { schema: { $ref: "#/components/schemas/DmsPurge" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
