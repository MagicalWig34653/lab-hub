        - { $ref: "#/components/parameters/DmsRule" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DmsRuleInput" }
      responses:
        "200":
          description: Regel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DmsRule" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
