    get:
      operationId: getDmsDocumentExtraction
      summary: Dokumentart und Fakten eines Dokuments (WP-D7, Berechtigung dms.document.read); ohne Extraktion 404
      description: |
        Allgemeines Ergebnis fuer alle Dokumente: kind (invoice, receipt, contract, letter, bank_statement, insurance, tax_notice, reminder, other) mit Score und Begruendung,
        facts mit Typ, Wert (Betraege als Dezimalzeichenkette, Daten yyyy-MM-dd, IBAN/USt-ID kompakt), Konfidenz, Begruendung und Fundstelle (offset, length, excerpt).
        Nur fuer kind=invoice liefert invoice das typisierte Faktenprofil (Grundlage der Eingangsrechnung-Vorschlaege, WP X1). Nichts wird angewendet, Vorschlaege stehen unter suggestions.
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
        - { $ref: "#/components/parameters/DmsDocument" }
      responses:
