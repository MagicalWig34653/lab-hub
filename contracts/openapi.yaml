openapi: 3.1.0
info:
  title: lab-hub API
  version: "1"
  description: |
    Vertrag des lab-hub-Backends (WP-K4). Quelle fuer TypeScript- und Swift-Client.
    Jede Route des Servers muss hier stehen und umgekehrt (Vertragstest AK-K4-1).
    Fehler sind immer application/problem+json (AK-K4-2).
    Hinweis zum Test-Parser: Pfade stehen auf Einrueckung 2, Methoden auf Einrueckung 4.
servers:
  - url: https://hub.example.org
paths:
  /health:
    get:
      operationId: getHealth
      summary: Prozess lebt
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
  /ready:
    get:
      operationId: getReady
      summary: Instanz darf Anfragen bekommen (Datenbank erreichbar, Schema aktuell)
      responses:
        "200":
          description: Bereit
        "503":
          $ref: "#/components/responses/Problem"
  /api/version:
    get:
      operationId: getVersion
      summary: Server-, API- und Schema-Version
      responses:
        "200":
          description: Versionen
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionInfo"
  /api/v1/auth/bootstrap/options:
    post:
      operationId: bootstrapOptions
      summary: Erster Nutzer, Schritt 1 (nur mit Setup-Token, nur solange es keinen Nutzer gibt)
      description: Ohne konfiguriertes SETUP_TOKEN oder wenn bereits ein Nutzer existiert 404. Falsches Token 403 setup_token_invalid. Rate-limitiert.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BootstrapOptionsRequest" }
      responses:
        "200": { $ref: "#/components/responses/PasskeyOptions" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /api/v1/auth/bootstrap/verify:
    post:
      operationId: bootstrapVerify
      summary: Erster Nutzer, Schritt 2 (Passkey bestaetigen, Sitzung beginnt)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasskeyVerifyRequest" }
      responses:
        "201": { $ref: "#/components/responses/Session" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /api/v1/auth/register/options:
    post:
      operationId: registerOptions
      summary: Registrierung per Einladung, Schritt 1
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterOptionsRequest" }
      responses:
        "200": { $ref: "#/components/responses/PasskeyOptions" }
        "409": { $ref: "#/components/responses/Problem" }
        "410": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /api/v1/auth/register/verify:
    post:
      operationId: registerVerify
      summary: Registrierung per Einladung, Schritt 2 (Einladung wird atomar eingeloest)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasskeyVerifyRequest" }
      responses:
        "201": { $ref: "#/components/responses/Session" }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "410": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /api/v1/auth/login/options:
    post:
      operationId: loginOptions
      summary: Anmeldung per Passkey, Schritt 1 (ohne Benutzername)
      responses:
        "200": { $ref: "#/components/responses/PasskeyOptions" }
        "429": { $ref: "#/components/responses/Problem" }
  /api/v1/auth/login/verify:
    post:
      operationId: loginVerify
      summary: Anmeldung per Passkey, Schritt 2
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasskeyVerifyRequest" }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /api/v1/auth/recovery/login:
    post:
      operationId: recoveryLogin
      summary: Anmeldung mit Recovery-Code (einmalig; Ergebnis ist eine eingeschraenkte Notfall-Sitzung)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecoveryLoginRequest" }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /api/v1/auth/session:
    get:
      operationId: getSession
      summary: Aktuelle Sitzung (auch Notfall-Sitzung)
      security: [{ bearer: [] }, { cookie: [] }]
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401": { $ref: "#/components/responses/Problem" }
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Aktuelle Sitzung beenden
      security: [{ bearer: [] }, { cookie: [] }]
      responses:
        "204": { description: Abgemeldet }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/auth/logout-all:
    post:
      operationId: logoutAll
      summary: Alle Geraete abmelden (alle Sitzungen des Nutzers)
      security: [{ bearer: [] }, { cookie: [] }]
      responses:
        "200":
          description: Anzahl widerrufener Sitzungen
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked: { type: integer }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/auth/sessions:
    get:
      operationId: listSessions
      summary: Aktive Sitzungen des Nutzers
      security: [{ bearer: [] }, { cookie: [] }]
      responses:
        "200":
          description: Sitzungen
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/SessionInfo" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/auth/sessions/{id}:
    delete:
      operationId: revokeSession
      summary: Eine eigene Sitzung beenden (fremde ID liefert 404)
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Beendet }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/tenants:
    get:
      operationId: listTenants
      summary: Mandanten, in denen der Nutzer Mitglied ist (nur eigene)
      security: [{ bearer: [] }, { cookie: [] }]
      responses:
        "200":
          description: Eigene Mandanten mit Rolle
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/TenantMembership" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createTenant
      summary: Mandant anlegen; nur Betreiber. Der Aufrufer wird Owner.
      security: [{ bearer: [] }, { cookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
      responses:
        "201":
          description: Mandant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantMembership" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/tenants/{tenant}:
    get:
      operationId: getTenant
      summary: Mandant mit eigener Rolle und Berechtigungen (Berechtigung tenant.tenant.read)
      description: Kein Mitglied, unbekannter oder deaktivierter Mandant liefert 404.
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
      responses:
        "200":
          description: Mandant
          content:
            application/json:
              schema:
                type: object
                required: [id, name, role, permissions]
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  role: { $ref: "#/components/schemas/Role" }
                  permissions: { type: array, items: { type: string, description: "<modul>.<ressource>.<aktion>" } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/tenants/{tenant}/members:
    get:
      operationId: listMembers
      summary: Mitglieder des Mandanten (Berechtigung tenant.member.read)
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
      responses:
        "200":
          description: Mitglieder
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Member" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/tenants/{tenant}/members/{user}:
    patch:
      operationId: changeMemberRole
      summary: Rolle eines Mitglieds aendern (Berechtigung tenant.member.manage); der letzte Owner bleibt (409 last_owner)
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
        - { name: user, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "200":
          description: Neue Rolle
          content:
            application/json:
              schema:
                type: object
                required: [user_id, role]
                properties:
                  user_id: { type: string, format: uuid }
                  role: { $ref: "#/components/schemas/Role" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: removeMember
      summary: Mitglied entfernen (Berechtigung tenant.member.manage); der letzte Owner bleibt (409 last_owner)
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
        - { name: user, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Entfernt }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/tenants/{tenant}/invitations:
    post:
      operationId: createInvitation
      summary: Einladung (Einmal-Link) in den Mandanten erzeugen (Berechtigung tenant.member.invite)
      description: Die Einladung bindet Mandant und Rolle (Standard member). Der Klartext-Token wird nur in dieser Antwort geliefert.
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { $ref: "#/components/schemas/Role" }
                expires_in_hours: { type: integer, minimum: 1, maximum: 720 }
      responses:
        "201":
          description: Einladung
          content:
            application/json:
              schema:
                type: object
                required: [id, token, expires_at, role]
                properties:
                  id: { type: string, format: uuid }
                  token: { type: string }
                  expires_at: { type: string, format: date-time }
                  role: { $ref: "#/components/schemas/Role" }
                  link: { type: string }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/modules:
    get:
      operationId: listModules
      summary: Katalog der installierten Module der Installation (ohne Mandantenbezug)
      description: Status je Mandant liefert GET /api/v1/tenants/{tenant}/modules.
      security: [{ bearer: [] }, { cookie: [] }]
      responses:
        "200":
          description: Module
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [key, requires, enhances, installed]
                      properties:
                        key: { type: string }
                        requires: { type: array, items: { type: string } }
                        enhances: { type: array, items: { type: string } }
                        installed: { type: boolean, description: "false = vom Betreiber fuer die ganze Installation abgeschaltet" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/modules/{module}:
    put:
      operationId: setModuleInstalled
      summary: Modul fuer die ganze Installation ein- oder ausschalten (nur Betreiber)
      description: Ausgeschaltet ist das Modul fuer alle Mandanten unwirksam (404 module_disabled auf seinen Routen); Daten bleiben erhalten. Wird im Audit protokolliert.
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { name: module, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: Neuer Stand
          content:
            application/json:
              schema:
                type: object
                required: [key, installed]
                properties:
                  key: { type: string }
                  installed: { type: boolean }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/tenants/{tenant}/modules:
    get:
      operationId: listTenantModules
      summary: Modulstatus und Navigation des Mandanten (Berechtigung tenant.module.read)
      description: >-
        `effective` = vom Betreiber installiert, im Mandanten an und alle requires wirksam. `navigation` enthaelt nur Eintraege wirksamer Module,
        die die Rolle des Aufrufers sehen darf.
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
      responses:
        "200":
          description: Module und Navigation
          content:
            application/json:
              schema:
                type: object
                required: [items, navigation]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [key, requires, enhances, installed, enabled, effective]
                      properties:
                        key: { type: string }
                        requires: { type: array, items: { type: string } }
                        enhances: { type: array, items: { type: string } }
                        installed: { type: boolean }
                        enabled: { type: boolean }
                        effective: { type: boolean }
                  navigation:
                    type: array
                    items:
                      type: object
                      required: [module, key, label_key, path]
                      properties:
                        module: { type: string }
                        key: { type: string }
                        label_key: { type: string, description: i18n-Schluessel }
                        path: { type: string }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/tenants/{tenant}/modules/{module}:
    put:
      operationId: setTenantModule
      summary: Modul im Mandanten ein- oder ausschalten (Berechtigung tenant.module.manage)
      description: >-
        Idempotent. Einschalten scheitert mit 409 module_requires (Abhaengigkeit nicht aktiv; errors nennt sie) oder 409 module_unavailable
        (vom Betreiber abgeschaltet). Ausschalten scheitert mit 409 module_required_by, solange ein aktives Modul davon abhaengt. Daten bleiben erhalten.
        Eigene Routen eines Moduls (`/api/v1/tenants/{tenant}/<modul>/...`) liefern bei unwirksamem Modul 404 module_disabled; sie stehen im Vertrag
        des jeweiligen Moduls, nicht hier.
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
        - { name: module, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: Neuer Stand
          content:
            application/json:
              schema:
                type: object
                required: [key, enabled, installed, effective]
                properties:
                  key: { type: string }
                  enabled: { type: boolean }
                  installed: { type: boolean }
                  effective: { type: boolean }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/me/recovery-codes:
    get:
      operationId: getRecoveryCodeStatus
      summary: Anzahl unbenutzter Recovery-Codes
      security: [{ bearer: [] }, { cookie: [] }]
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                type: object
                required: [remaining]
                properties:
                  remaining: { type: integer }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: generateRecoveryCodes
      summary: Neue Recovery-Codes erzeugen (ersetzt alte; Klartext nur in dieser Antwort)
      security: [{ bearer: [] }, { cookie: [] }]
      responses:
        "201":
          description: Codes
          content:
            application/json:
              schema:
                type: object
                required: [codes]
                properties:
                  codes: { type: array, items: { type: string } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/me/passkeys:
    get:
      operationId: listPasskeys
      summary: Eigene Passkeys
      security: [{ bearer: [] }, { cookie: [] }]
      responses:
        "200":
          description: Passkeys
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/PasskeyInfo" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/me/passkeys/options:
    post:
      operationId: addPasskeyOptions
      summary: Weiteren Passkey anlegen, Schritt 1 (auch in Notfall-Sitzung)
      security: [{ bearer: [] }, { cookie: [] }]
      responses:
        "200": { $ref: "#/components/responses/PasskeyOptions" }
        "401": { $ref: "#/components/responses/Problem" }
  /api/v1/me/passkeys/verify:
    post:
      operationId: addPasskeyVerify
      summary: Weiteren Passkey anlegen, Schritt 2 (stuft eine Notfall-Sitzung zur normalen hoch)
      security: [{ bearer: [] }, { cookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasskeyVerifyRequest" }
      responses:
        "201":
          description: Angelegter Passkey
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeyInfo" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/me/passkeys/{id}:
    delete:
      operationId: revokePasskey
      summary: Eigenen Passkey widerrufen (der letzte bleibt erhalten; fremde ID liefert 404)
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Widerrufen }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  # --- WP-K5: Kontakte und Links ---
  /api/v1/tenants/{tenant}/contacts:
    get:
      operationId: listContacts
      summary: Kontakte des Mandanten (Berechtigung contact.contact.read); ohne geloeschte und zusammengefuehrte; Liste ohne Unterlisten
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Count" }
        - { name: q, in: query, description: "Suche in Name, Aliasen, USt-ID, E-Mail", schema: { type: string } }
        - { name: role, in: query, schema: { type: string, enum: [customer, supplier, correspondent] } }
        - { name: kind, in: query, schema: { type: string, enum: [person, organization] } }
      responses:
        "200":
          description: Seite von Kontakten
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Contact" } }
                  next_cursor: { type: [string, "null"] }
                  total: { type: [integer, "null"] }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createContact
      summary: Kontakt anlegen (Berechtigung contact.contact.create); die Antwort nennt moegliche Dubletten (gleiche USt-ID oder IBAN), legt aber immer an
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactInput" }
