  /api/v1/tenants/{tenant}/dms/duplicates:
    get:
      operationId: listDmsDuplicates
      summary: Duplikat-Hinweise mit Gegenueberstellung (Berechtigung dms.document.read); Standard nur offene
      description: Stufe 1 sha256 (gleiches Original), Stufe 2 text_hash (gleicher normalisierter Text) und similarity (Text-Shingles, bei mittlerer Aehnlichkeit nur mit gleichem Belegdatum und aehnlichem Titel). Nie wird ein Dokument verworfen.
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Count" }
        - { name: state, in: query, schema: { type: string, enum: [open, confirmed, dismissed, all], default: open } }
        - { name: method, in: query, schema: { type: string, enum: [sha256, text_hash, similarity] } }
        - { name: document_id, in: query, schema: { type: string, format: uuid }, description: "Paare, in denen dieses Dokument vorkommt" }
      responses:
        "200":
          description: Duplikatseite
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DmsDuplicatePage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/tenants/{tenant}/dms/duplicates/{duplicate}/resolve:
    post:
      operationId: resolveDmsDuplicate
      summary: Duplikat-Hinweis entscheiden (Berechtigung dms.document.update); loescht und verschiebt nichts, Audit dms.duplicate.resolved
