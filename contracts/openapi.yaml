              schema: { $ref: "#/components/schemas/DmsExtraction" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/tenants/{tenant}/dms/documents/{document}/extraction/run:
    post:
      operationId: runDmsDocumentExtraction
      summary: Extraktion fuer ein Dokument neu ausfuehren (WP-D7, Berechtigung dms.document.update)
      description: |
        Wiederholt die Extraktion mit dem zuletzt gespeicherten Text (Extraktorversion wird gespeichert). Gleicher Text und gleiche Version ergeben dasselbe Ergebnis; Vorschlaege und das
        Ereignis werden nicht doppelt angelegt. Audit dms.extraction.rerun. Papierkorb oder Dokument ohne Text: 409 (conflict, Detail no_text bzw. document_trashed).
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
        - { $ref: "#/components/parameters/DmsDocument" }
      responses:
        "200":
          description: Neues Ergebnis
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DmsExtraction" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/tenants/{tenant}/dms/documents/{document}/processing:
    get:
      operationId: getDmsDocumentProcessing
      summary: Verarbeitungsstatus (Eingangsvorgang, OCR) eines Dokuments (Berechtigung dms.document.read)
      description: |
        Fortschritt der Ingest-Kette fuer die Anzeige. state ist der Ingest-Zustand (none, wenn es keinen Vorgang gibt), phase die Anzeigestufe:
        none, pending (noch nicht eingereiht), queued (OCR-Job wartet), processing (Job laeuft bzw. Nachbearbeitung), done, retrying (vorlaeufiger Fehler, Wiederholung folgt),
        failed (Quarantaene, error_code nennt den Grund, z. B. pdf_encrypted, too_many_pages, ocr_timeout). text beschreibt die aktuelle Textrevision, has_archive zeigt die Archivversion
        (GET .../file?role=archive). Abfragen genuegen (Polling), es gibt noch keine Ereignisse.
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
        - { $ref: "#/components/parameters/DmsDocument" }
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DmsProcessing" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
