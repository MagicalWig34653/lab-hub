      parameters:
        - { $ref: "#/components/parameters/Tenant" }
        - { $ref: "#/components/parameters/InvoiceMasterId" }
      responses:
        "200":
          description: PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/tenants/{tenant}/invoice/documents/{id}/convert:
    post:
      operationId: convertInvoiceDocument
      summary: "Beleg umwandeln (Berechtigung invoice.document.create)"
      description: "Erzeugt aus einem finalisierten Beleg einen Entwurf der Zielart (Kopf, Positionen, Zusatzkosten, Skontobedingung kopiert) und verknuepft beide (kind conversion). Wege: quote nach order_confirmation, delivery_note, invoice; order_confirmation nach delivery_note, invoice; delivery_note nach invoice; sonst 422 conversion_not_allowed. Entwurf als Ausgangsbeleg 409 document_not_final. Die Art des Entwurfs ist gesperrt (kind_locked). Optional Idempotency-Key."
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
        - { $ref: "#/components/parameters/InvoiceMasterId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvoiceDeriveInput" }
      responses:
        "201":
          description: Entwurf angelegt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoiceDocument" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/tenants/{tenant}/invoice/documents/{id}/credit-note:
    post:
      operationId: createInvoiceCreditNote
      summary: "Gutschrift zu einer Rechnung anlegen (Berechtigung invoice.document.create)"
      description: "Entwurf mit negierten Mengen und Betraegen der finalisierten Rechnung, verknuepft (kind credit_note); aenderbar fuer Teilgutschriften. Wirkt erst nach dem Finalisieren. Dabei geprueft (422, keine Nummer verbraucht): Summe negativ (credit_must_be_negative), gleiche Waehrung und gleicher Kontakt (differs_from_invoice), alle Gutschriften zusammen nie mehr als die Rechnung (credit_exceeds_invoice). Optional Idempotency-Key."
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
        - { $ref: "#/components/parameters/InvoiceMasterId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvoiceDeriveInput" }
      responses:
        "201":
          description: Gutschrift-Entwurf angelegt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoiceDocument" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/tenants/{tenant}/invoice/documents/{id}/balance:
    get:
      operationId: getInvoiceBalance
      summary: "Saldo einer finalisierten Rechnung (Berechtigung invoice.payment.read)"
      description: "Nur finalisierte Rechnungen (sonst 409 document_not_final bzw. 422 not_an_invoice). open_balance = Brutto minus zugeordnete Zahlungen minus gewaehrtes Skonto; total_balance zieht finalisierte Gutschriften ab."
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
        - { $ref: "#/components/parameters/InvoiceMasterId" }
      responses:
        "200":
          description: Saldo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoiceBalance" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/tenants/{tenant}/invoice/documents/{id}/links:
    get:
      operationId: listInvoiceDocumentLinks
      summary: "Verknuepfungen eines Belegs (Berechtigung invoice.document.read)"
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
        - { $ref: "#/components/parameters/InvoiceMasterId" }
      responses:
        "200":
          description: Verknuepfungen
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/InvoiceDocumentLink" } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createInvoiceDocumentLink
      summary: "Referenz auf einen anderen Beleg anlegen (Berechtigung invoice.document.update)"
      description: "Nur kind reference; conversion und credit_note entstehen ausschliesslich durch Umwandlung bzw. Gutschrift. Je Belegpaar eine Referenz (409 conflict)."
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
        - { $ref: "#/components/parameters/InvoiceMasterId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvoiceDocumentLinkInput" }
      responses:
        "201":
          description: Angelegt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoiceDocumentLink" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/tenants/{tenant}/invoice/documents/{id}/links/{link}:
    delete:
      operationId: deleteInvoiceDocumentLink
      summary: "Referenz entfernen (Berechtigung invoice.document.update)"
      description: "Verknuepfungen aus Umwandlung und Gutschrift: 409 document_link_locked (ein Entwurf samt Verknuepfung verschwindet durch Loeschen des Entwurfs)."
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
        - { $ref: "#/components/parameters/InvoiceMasterId" }
        - { name: link, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Entfernt }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/tenants/{tenant}/invoice/payments:
    get:
      operationId: listInvoicePayments
      summary: "Zahlungen (Berechtigung invoice.payment.read)"
      description: "Neueste zuerst, hoechstens 1000. unassigned=true: nicht stornierte Zahlungen mit nicht zugeordnetem Rest."
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
        - { name: unassigned, in: query, required: false, schema: { type: boolean } }
        - { name: contact_id, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Zahlungen
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/InvoicePayment" } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createInvoicePayment
      summary: "Zahlungseingang erfassen (Berechtigung invoice.payment.write)"
      description: "Legt eine Zahlung ohne Zuordnung an: es wird nie automatisch zugeordnet. Betrag als Dezimal-String mit hoechstens 2 Nachkommastellen. Optional Idempotency-Key."
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvoicePaymentInput" }
      responses:
        "201":
          description: Erfasst
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoicePayment" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/tenants/{tenant}/invoice/payments/{id}:
    get:
      operationId: getInvoicePayment
      summary: "Zahlung mit Zuordnungen samt Historie (Berechtigung invoice.payment.read)"
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
        - { $ref: "#/components/parameters/InvoiceMasterId" }
      responses:
        "200":
          description: Zahlung
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoicePayment" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/tenants/{tenant}/invoice/payments/{id}/suggestions:
    get:
      operationId: suggestInvoiceAllocations
      summary: "Zuordnungsvorschlaege (Berechtigung invoice.payment.read)"
      description: "Reine Abfrage, aendert nichts. Offene finalisierte Rechnungen gleicher Waehrung mit mindestens einer Begruendung (number_in_reference, amount_matches_open, amount_matches_skonto, same_contact), beste zuerst, hoechstens 20."
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
        - { $ref: "#/components/parameters/InvoiceMasterId" }
      responses:
        "200":
          description: Vorschlaege
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/InvoiceAllocationSuggestion" } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/tenants/{tenant}/invoice/payments/{id}/allocations:
    post:
      operationId: allocateInvoicePayment
      summary: "Zahlung ausdruecklich zuordnen (Berechtigung invoice.payment.write)"
      description: "Nur mit confirmed=true. Beleg, Betrag und Skonto kommen ausschliesslich aus der Anfrage. Grenzen (422): exceeds_payment; exceeds_open_amount ohne overpayment=true; Skonto nur mit Bedingung am Beleg (skonto_not_allowed), Zahldatum innerhalb der Frist (skonto_period_expired), hoechstens vereinbarter Satz auf Brutto abzueglich Gutschriften (skonto_exceeds_terms) und nur wenn der Rest damit ausgeglichen ist (skonto_must_settle). 409: payment_voided, document_not_final, conflict (schon zugeordnet). Optional Idempotency-Key."
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
        - { $ref: "#/components/parameters/InvoiceMasterId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvoiceAllocationInput" }
      responses:
        "201":
          description: Zugeordnet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoicePayment" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/tenants/{tenant}/invoice/payments/{id}/allocations/{allocation}:
    delete:
      operationId: revokeInvoiceAllocation
      summary: "Zuordnung zuruecknehmen (Berechtigung invoice.payment.write)"
      description: "Die Zuordnung bleibt mit revoked_at in der Historie."
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
        - { $ref: "#/components/parameters/InvoiceMasterId" }
        - { name: allocation, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Zurueckgenommen
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoicePayment" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/tenants/{tenant}/invoice/payments/{id}/void:
    post:
      operationId: voidInvoicePayment
      summary: "Fehlbuchung stornieren (Berechtigung invoice.payment.write)"
      description: "Nur ohne aktive Zuordnung (409 payment_allocated); Grund Pflicht. Zahlungen werden nie geloescht."
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
        - { $ref: "#/components/parameters/InvoiceMasterId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvoicePaymentVoidInput" }
      responses:
        "200":
          description: Storniert
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoicePayment" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, description: "Sitzungstoken fuer Apps (Header X-Auth-Transport: bearer bei der Anmeldung)" }
    apiToken: { type: http, scheme: bearer, description: "Persoenliches API-Token (Praefix lhp_) mit Scope; nur an Routen mit ausdruecklichem Scope (WP-D4, Minimalstand F-05)" }
    cookie: { type: apiKey, in: cookie, name: lh_session, description: "HttpOnly-Cookie der PWA; schreibende Methoden brauchen X-CSRF-Token" }
  headers:
    XRequestId:
      description: Korrelations-ID der Anfrage; eine gueltige eingehende ID wird uebernommen.
      schema: { type: string, maxLength: 64, pattern: "^[A-Za-z0-9._-]+$" }
  parameters:
    Tenant:
      name: tenant
      in: path
      required: true
      description: Mandant. Kein Mitglied, unbekannt oder ungueltig liefert 404.
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: Opaker Cursor aus next_cursor der vorigen Seite.
      schema: { type: string }
    Count:
      name: count
      in: query
      description: Gesamtzahl nur auf Anforderung (teuer).
      schema: { type: boolean, default: false }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Pflicht bei finalisierenden POSTs. Gleicher Key + gleicher Request = gespeicherte Antwort; anderer Request = 422 idempotency_key_reused.
      schema: { type: string, minLength: 1, maxLength: 255 }
    Contact:
      name: contact
      in: path
      required: true
      schema: { type: string, format: uuid }
    LinkId:
      name: link
      in: path
      required: true
      schema: { type: string, format: uuid }
    DmsDocument:
      name: document
      in: path
      required: true
      schema: { type: string, format: uuid }
    DmsMasterId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    InvoiceMasterId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    DmsRule:
      name: rule
      in: path
      required: true
      schema: { type: string, format: uuid }
    DmsSuggestion:
      name: suggestion
      in: path
      required: true
      schema: { type: string, format: uuid }
    DmsSource:
      name: source
      in: path
      required: true
      description: Quelle des Mandanten. Fremd oder unbekannt liefert 404.
      schema: { type: string, format: uuid }
    DmsScanJob:
      name: job
      in: path
      required: true
      description: Scan-Auftrag des Mandanten. Fremd oder unbekannt liefert 404.
      schema: { type: string, format: uuid }
    DmsImport:
      name: import
      in: path
      required: true
      description: Import-Lauf des Mandanten. Fremd oder unbekannt liefert 404.
      schema: { type: string, format: uuid }
    DmsDuplicate:
      name: duplicate
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Problem:
      description: Fehler (RFC 9457)
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PasskeyOptions:
      description: WebAuthn-Optionen fuer navigator.credentials.create/get plus challenge_id (Challenge einmalig, 5 Minuten gueltig)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PasskeyOptionsResponse" }
    Session:
      description: Sitzung. Bei Anmeldung wird das Cookie lh_session gesetzt (HttpOnly, SameSite=Lax), mit Header X-Auth-Transport bearer stattdessen token im Body.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SessionResponse" }
  schemas:
    Preferences:
      type: object
      required: [accent]
      properties:
        accent:
          type: [string, "null"]
          pattern: "^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$"
          description: Akzentfarbe als Hex; die Antwort liefert immer kleingeschriebenes `#rrggbb` oder null
    PasskeyOptionsResponse:
      type: object
      required: [challenge_id, public_key]
      properties:
        challenge_id: { type: string, format: uuid }
        public_key: { type: object, description: "PublicKeyCredentialCreationOptions bzw. RequestOptions (JSON)" }
    PasskeyVerifyRequest:
      type: object
      required: [challenge_id, credential]
      properties:
        challenge_id: { type: string, format: uuid }
        credential: { type: object, description: "Ergebnis von navigator.credentials.create/get (Base64URL-Felder)" }
        name: { type: string, minLength: 1, maxLength: 80, description: "Nur beim Anlegen weiterer Passkeys" }
    BootstrapOptionsRequest:
      type: object
      required: [setup_token, handle, display_name]
      properties:
        setup_token: { type: string }
        handle: { type: string, pattern: "^[a-z0-9][a-z0-9._-]{2,31}$" }
        display_name: { type: string, minLength: 1, maxLength: 80 }
        tenant_name: { type: string, minLength: 1, maxLength: 80, description: "Name des ersten Mandanten (Standard Hauptmandant); der Nutzer wird Betreiber und Owner" }
    RegisterOptionsRequest:
      type: object
      required: [invite_token, handle, display_name]
      properties:
        invite_token: { type: string }
        handle: { type: string, pattern: "^[a-z0-9][a-z0-9._-]{2,31}$" }
        display_name: { type: string, minLength: 1, maxLength: 80 }
    RecoveryLoginRequest:
      type: object
      required: [handle, code]
      properties:
        handle: { type: string }
        code: { type: string }
    SessionResponse:
      type: object
      required: [user, memberships, kind, expires_at, csrf_token]
      properties:
        user:
          type: object
          required: [id, handle, display_name, is_operator]
          properties:
            id: { type: string, format: uuid }
            handle: { type: string }
            display_name: { type: string }
            is_operator: { type: boolean, description: "Betreiber duerfen Mandanten anlegen (ersetzt is_admin aus WP-K1)" }
        memberships:
          type: array
          items:
            type: object
            required: [tenant_id, name, role]
            properties:
              tenant_id: { type: string, format: uuid }
              name: { type: string }
              role: { $ref: "#/components/schemas/Role" }
        kind: { type: string, enum: [normal, recovery] }
        expires_at: { type: string, format: date-time }
        csrf_token: { type: string }
        token: { type: string, description: "Nur bei Anmeldung mit X-Auth-Transport bearer" }
    Role:
      type: string
      enum: [owner, accountant, member, tax_advisor, customer_viewer]
    TenantMembership:
      type: object
      required: [id, name, role]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
    Member:
      type: object
      required: [user_id, handle, display_name, role, created_at]
      properties:
        user_id: { type: string, format: uuid }
        handle: { type: string }
        display_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        created_at: { type: string, format: date-time }
    SessionInfo:
      type: object
      required: [id, kind, created_at, last_seen_at, expires_at, current]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [normal, recovery] }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        current: { type: boolean }
    PasskeyInfo:
      type: object
      required: [id, name, created_at, last_used_at, backed_up]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
        backed_up: { type: boolean }
    VersionInfo:
      type: object
      required: [server, api, schema]
      properties:
        server: { type: string }
        api: { type: string }
        schema: { type: [integer, "null"] }
    FieldError:
      type: object
      required: [field, code]
      properties:
        field: { type: string }
        code: { type: string }
    Problem:
      type: object
      required: [type, title, status, code, request_id]
      properties:
        type: { type: string, format: uri }
        title: { type: string, description: Deutsche Meldung }
        status: { type: integer }
        code:
          type: string
          description: Stabiler maschinenlesbarer Code
          enum:
            - api_token_unbound
            - bad_request
            - conflict
            - contact_merged
            - csrf_invalid
            - document_final_immutable
            - document_link_locked
            - document_linked
            - document_not_draft
            - document_not_final
            - document_not_trashed
            - document_trashed
            - forbidden
            - handle_taken
            - idempotency_in_progress
            - idempotency_key_required
            - idempotency_key_reused
            - ingest_not_failed
            - internal_error
            - invalid_cursor
            - invalid_limit
            - invitation_invalid
            - last_owner
            - last_passkey
            - legal_hold
            - login_failed
            - method_not_allowed
            - module_disabled
            - module_required_by
            - module_requires
            - module_unavailable
            - not_found
            - number_conflict
            - passkey_invalid
            - payload_too_large
            - payment_allocated
            - payment_voided
            - precondition_failed
            - recovery_session_restricted
            - render_failed
