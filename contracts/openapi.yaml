        Der Dateiname kommt aus dem Titel. Header nosniff, CSP sandbox, Cache-Control private, no-store. Download des Originals wird im Audit protokolliert.
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
        - { $ref: "#/components/parameters/DmsDocument" }
        - { name: role, in: query, schema: { type: string, enum: [original, archive, thumbnail, derivative], default: original } }
        - { name: disposition, in: query, schema: { type: string, enum: [attachment, inline], default: attachment } }
      responses:
        "200":
          description: Dateiinhalt
          content:
