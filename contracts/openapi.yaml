        - { $ref: "#/components/parameters/DmsDocument" }
        - { name: role, in: query, schema: { type: string, enum: [original, archive, thumbnail, derivative], default: original } }
        - { name: disposition, in: query, schema: { type: string, enum: [attachment, inline], default: attachment } }
      responses:
