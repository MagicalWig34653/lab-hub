  # --- WP-D2: DMS-Kern (Modul dms; Modul nicht aktiv: 404 module_disabled; Berechtigungen dms.*) ---
  /api/v1/tenants/{tenant}/dms/uploads:
    post:
      operationId: dmsUpload
      summary: Datei hochladen (Berechtigung dms.document.create). Body = Dateiinhalt, gestreamt; Typ wird an den Magic Bytes erkannt (PDF, PNG, JPEG, TIFF, WebP), nicht an Endung oder Content-Type
      description: |
        Query: filename, title, doc_date (yyyy-MM-dd), document_type_id, archive (true vergibt die ASN sofort). Idempotency-Key ist Pflicht;
        gleicher Key + gleicher Inhalt/Parameter liefert die gespeicherte Antwort, anderer Inhalt 422 idempotency_key_reused.
        Ein bereits vorhandenes Original im Mandanten wird nicht abgelehnt, sondern als duplicates gemeldet.
        Zu gross 413 payload_too_large, unbekannter Typ 415 unsupported_media_type.
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { name: filename, in: query, schema: { type: string, maxLength: 255 } }
        - { name: title, in: query, schema: { type: string, maxLength: 300 } }
        - { name: doc_date, in: query, schema: { type: string, format: date } }
        - { name: document_type_id, in: query, schema: { type: string, format: uuid } }
        - { name: archive, in: query, schema: { type: boolean, default: false } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Dokument angelegt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DmsDocument" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
