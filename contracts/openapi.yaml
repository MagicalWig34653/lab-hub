  # --- WP-S1 Suche ---
  /api/v1/tenants/{tenant}/dms/search:
    get:
      operationId: searchDmsDocuments
      summary: Volltextsuche ueber Dokumente (Berechtigung dms.document.read); Papierkorb ausgeschlossen
      description: |
        PostgreSQL-Suche (ADR 0005): Titel, Metadaten (Korrespondent, Typ, Tags, Dateiname des Originals) und aktueller Text (deutsch/englisch, mit Wortstamm, ohne Umlautzwang).
        Leeres oder fehlendes q durchsucht ohne Suchbegriff (Durchsuchen): alle Dokumente des Mandanten ausser Papierkorb, neueste Eingaenge zuerst (score = Eingangszeit in Sekunden seit Epoche, snippet null),
        mit denselben Filtern (Datum, Typ, Ablagepfad, Korrespondent, mehrere Tags), Facetten, Zaehlung und Cursor-Pagination wie die Suche. Der Cursor gilt nur fuer dieselbe Anfrage.
        q folgt websearch_to_tsquery: Leerzeichen = und, "Phrase", or, -Ausschluss. Ohne Operatoren greift zusaetzlich ein Tippfehler-Fallback (pg_trgm) auf Titel und Metadaten; fuzzy=false schaltet ihn ab.
        Sortierung nach Relevanz (absteigend), Volltexttreffer (score >= 1) vor Tippfehler-Treffern (score < 1). Cursor-Pagination wie ueberall (der Cursor ist an dieselbe Anfrage gebunden).
        Treffer im snippet stehen zwischen U+E000 und U+E001 (private Zeichen, kein HTML; der Client escaped den Text selbst).
        Facetten (facets=true) zaehlen ueber die gesamte gefilterte Treffermenge, je Facette die haeufigsten 20 Werte.
        WP-D9: dieselben Extraktions-, Quellen- und Vorschlagsfilter und dieselbe Sortierung wie GET documents (kind, kind_certain, currency, amount_min/max, extracted_from/to, due_from/to, reference, source,
        has_open_suggestions, sort, order); ohne q liefert die Suche bei gleichem Filter dieselbe Menge wie GET documents. sort = relevance (Standard) oder created_at, amount, extracted_date, due_date
        (dann gilt order, Standard asc, und der Cursor den Sortierwert wie bei GET documents). Jeder Treffer traegt source, open_suggestions und die Uebersichtswerte der Extraktion (extraction).
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Count" }
        - { name: q, in: query, schema: { type: string, maxLength: 200 }, description: "Suchbegriff; leer oder weggelassen = Durchsuchen ohne Suchbegriff" }
        - { name: fuzzy, in: query, schema: { type: boolean, default: true }, description: "false schaltet den Tippfehler-Fallback ab" }
        - { name: facets, in: query, schema: { type: boolean, default: false } }
        - { name: document_type_id, in: query, schema: { type: string, format: uuid } }
        - { name: storage_path_id, in: query, schema: { type: string, format: uuid } }
        - { name: correspondent_id, in: query, schema: { type: string, format: uuid } }
        - { name: tag_id, in: query, schema: { type: string }, description: "Eine oder mehrere Tag-IDs, durch Komma getrennt (hoechstens 10); alle muessen zutreffen" }
        - { name: date_from, in: query, schema: { type: string, format: date }, description: "doc_date >= (inklusive)" }
        - { name: date_to, in: query, schema: { type: string, format: date }, description: "doc_date <= (inklusive)" }
        - { name: kind, in: query, schema: { $ref: "#/components/schemas/DmsDocumentKind" } }
        - { name: kind_certain, in: query, schema: { type: boolean } }
        - { name: currency, in: query, schema: { type: string, pattern: "^[A-Z]{3}$" } }
        - { name: amount_min, in: query, schema: { type: string, pattern: "^-?[0-9]{1,13}(\\.[0-9]{1,2})?$" } }
        - { name: amount_max, in: query, schema: { type: string, pattern: "^-?[0-9]{1,13}(\\.[0-9]{1,2})?$" } }
        - { name: extracted_from, in: query, schema: { type: string, format: date } }
        - { name: extracted_to, in: query, schema: { type: string, format: date } }
        - { name: due_from, in: query, schema: { type: string, format: date } }
        - { name: due_to, in: query, schema: { type: string, format: date } }
        - { name: reference, in: query, schema: { type: string, maxLength: 100 } }
        - { name: source, in: query, schema: { $ref: "#/components/schemas/DmsDocumentSource" } }
        - { name: has_open_suggestions, in: query, schema: { type: boolean } }
        - { name: sort, in: query, schema: { type: string, enum: [relevance, created_at, amount, extracted_date, due_date], default: relevance } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
      responses:
        "200":
          description: Trefferseite
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DmsSearchPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/tenants/{tenant}/dms/documents/{document}/retention:
    get:
      operationId: getDmsDocumentRetention
      summary: Aufbewahrungszustand eines Dokuments (Berechtigung dms.document.read)
      description: |
        Wirksames Fristende, Herkunft der Frist (Dokumenttyp, Standard, manuell), Loeschsperre und die Gruende, die ein endgueltiges Loeschen derzeit verhindern (blockers).
        Die Fristen sind eine konfigurierbare, GoBD-orientierte Voreinstellung (Ende des Kalenderjahres des Belegdatums plus Jahre je Dokumenttyp, sonst DMS_DEFAULT_RETENTION_YEARS, Standard 10); keine Rechtsberatung und keine Konformitaetszusage.
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
        - { $ref: "#/components/parameters/DmsDocument" }
      responses:
        "200": { description: Aufbewahrungszustand, content: { application/json: { schema: { $ref: "#/components/schemas/DmsRetention" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateDmsDocumentRetention
      summary: Loeschsperre setzen/aufheben und Frist verlaengern (Berechtigung dms.document.retention)
      description: Mindestens ein Feld. Die manuelle Frist kann nur verlaengern (Verkuerzen 422). Audit dms.document.retention_changed.
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
        - { $ref: "#/components/parameters/DmsDocument" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                legal_hold: { type: boolean }
                retention_until: { type: string, format: date }
      responses:
        "200": { description: Neuer Zustand, content: { application/json: { schema: { $ref: "#/components/schemas/DmsRetention" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/tenants/{tenant}/dms/documents/{document}/purge:
    post:
      operationId: purgeDmsDocument
      summary: Endgueltig loeschen (Berechtigung dms.document.purge, nur Owner)
      description: |
        Nur aus dem Papierkorb, nach Ablauf der Aufbewahrungsfrist, ohne Loeschsperre und ohne aktive Verknuepfung (z. B. von einem Beleg). Sonst 409 mit dem ersten Grund als Code
        (document_not_trashed, legal_hold, retention_not_expired, document_linked). Entfernt Metadaten, Text, Eingangsvorgaenge und Dateizeilen in einer Transaktion und schreibt das Loeschprotokoll
        (Hash des Originals, Zeitpunkt, Person; kein Titel); die Bytes im Objektspeicher werden nur geloescht, wenn keine Dateizeile des Mandanten mehr darauf zeigt. Audit dms.document.purged.
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
        - { $ref: "#/components/parameters/DmsDocument" }
      responses:
        "200": { description: Geloescht, content: { application/json: { schema: { $ref: "#/components/schemas/DmsPurge" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/tenants/{tenant}/dms/deletion-log:
    get:
      operationId: listDmsDeletionLog
      summary: Loeschprotokoll, neueste 100 Eintraege (Berechtigung dms.document.trash)
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
      responses:
        "200":
          description: Eintraege
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/DmsDeletionLogEntry" } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/tenants/{tenant}/dms/integrity-runs:
    post:
      operationId: startDmsIntegrityRun
      summary: Integritaetspruefung starten (Berechtigung dms.integrity.run)
      description: |
        Reiht den Worker-Job dms.verify ein (202). Der Job liest jedes Objekt des Mandanten aus dem Objektspeicher und vergleicht SHA-256 und Groesse mit der Datenbank, danach prueft er die Hash-Kette
        des Audit-Logs. Abweichung = Zustand failed, Bericht mit Dokument, Rolle und Art (hash_mismatch, size_mismatch, missing, record_mismatch) und Audit dms.integrity.failed.
        Ein Zeitplaner ist nicht Teil des Hubs; periodische Laeufe loest ein externer Aufruf aus.
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
      responses:
        "202": { description: Lauf angelegt, content: { application/json: { schema: { $ref: "#/components/schemas/DmsIntegrityRun" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    get:
      operationId: listDmsIntegrityRuns
      summary: Letzte 50 Pruefungen (Berechtigung dms.integrity.run)
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
      responses:
        "200":
          description: Laeufe, neueste zuerst
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/DmsIntegrityRun" } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/tenants/{tenant}/dms/integrity-runs/{run}:
    get:
      operationId: getDmsIntegrityRun
      summary: Pruefbericht (Berechtigung dms.integrity.run)
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
        - { name: run, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Lauf, content: { application/json: { schema: { $ref: "#/components/schemas/DmsIntegrityRun" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/tenants/{tenant}/dms/exports:
    post:
      operationId: startDmsExport
      summary: Export starten (Berechtigung dms.export.run)
      description: |
        Reiht den Worker-Job dms.export ein (202). Ergebnis: ZIP mit documents/<ASN>/<rolle>-<titel>.<ext>, index.csv und manifest.json (SHA-256 und Groesse je Datei, Kopf der Hash-Kette).
        Papierkorb ist nicht enthalten. Jede Datei wird beim Packen gegen den gespeicherten Hash geprueft; Abweichung = Export failed (integrity_failed). Keine Konformitaetsaussage.
      security: [{ bearer: [] }, { cookie: [] }]
