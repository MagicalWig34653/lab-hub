  /api/v1/tenants/{tenant}/dms/documents/{document}/processing/retry:
    post:
      operationId: retryDmsDocumentProcessing
      summary: Dauerhaft fehlgeschlagene Verarbeitung (Quarantaene, failed_permanent) erneut anstossen (Berechtigung dms.document.update)
      description: |
        Setzt den Eingangsvorgang des Dokuments auf den letzten guten Zustand zurueck, reiht einen neuen OCR-Job ein (Prioritaet manuell) und schreibt einen Audit-Eintrag (dms.ingest.retried).
        Kein Body. Gibt den neuen Verarbeitungsstatus zurueck (wie GET .../processing). Ohne Quarantaene-Vorgang: 409 ingest_not_failed; Dokument im Papierkorb: 409 document_trashed;
        zwei gleichzeitige Aufrufe: genau einer wirkt, der andere erhaelt 409 ingest_not_failed. Die Ursache (z. B. verschluesseltes PDF) wird nicht behoben; scheitert der Lauf erneut, steht das Dokument wieder in Quarantaene.
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
        - { $ref: "#/components/parameters/DmsDocument" }
      responses:
        "200":
          description: Status nach dem Einreihen
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DmsProcessing" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
