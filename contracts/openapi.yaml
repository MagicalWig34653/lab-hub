  # --- WP-D3: Regeln, Vorschlaege, Duplikate ---
  /api/v1/tenants/{tenant}/dms/rules:
    get:
      operationId: listDmsRules
      summary: Regeln des Mandanten (Berechtigung dms.rule.read), aelteste zuerst; ohne geloeschte
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Count" }
      responses:
        "200":
          description: Regelseite
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DmsRulePage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createDmsRule
      summary: Regel anlegen (Berechtigung dms.rule.manage); Modus Standard suggest, Audit dms.rule.created
      description: |
        Bedingungen (conditions.conditions, match all|any): text_contains, text_regex, filename_contains, filename_regex, sender_contains, source_is.
        Regex hoechstens 200 Zeichen und mit Zeitlimit bei der Auswertung (Standard 250 ms je Dokument, Betrieb DMS_REGEX_TIMEOUT_MS); ein Abbruch zaehlt als "nicht erfuellt".
        Aktionen: correspondent_id, document_type_id, tag_ids, storage_path_id, doc_date (extracted oder yyyy-MM-dd), title_template ({filename}, {match}, {date}).
        Modus auto wendet nur bei leeren Einzelwerten an (F-25), Standard suggest aendert nie Metadaten. Unbekannte Schluessel und fremde Verweise: 422. Gleicher Name (ohne Gross-/Kleinschreibung): 409.
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DmsRuleInput" }
      responses:
        "201":
          description: Regel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DmsRule" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/tenants/{tenant}/dms/rules/preview:
    post:
      operationId: previewDmsRuleDraft
      summary: Trockenlauf eines Entwurfs gegen vorhandene Dokumente (Berechtigung dms.rule.manage); schreibt nichts
      description: |
        Prueft die juengsten Dokumente (limit 1..500, Standard 100, ohne Papierkorb) gegen den Entwurf. Kein Audit, keine Zeile, keine Aenderung.
        Antwort: geprueft, getroffen, Regex-Abbrueche (timed_out), truncated (Zeitbudget 20 s aufgebraucht), Treffer mit Fundstelle und den Vorschlaegen, die entstaenden.
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DmsRuleInput" }
      responses:
        "200":
          description: Trockenlauf
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DmsRulePreview" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
