        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state: { type: string, enum: [confirmed, dismissed] }
      responses:
        "200":
          description: Duplikat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DmsDuplicate" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/auth/api-tokens:
    get:
      operationId: listApiTokens
      summary: Eigene API-Tokens (WP-D4, Minimalstand F-05); ohne Token-Klartext
      description: Nur mit Sitzung (kein API-Token, keine Notfall-Sitzung). Zeigt auch widerrufene und abgelaufene Tokens.
      security: [{ bearer: [] }, { cookie: [] }]
      responses:
        "200":
          description: Tokens des Nutzers
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ApiToken" } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createApiToken
      summary: API-Token mit Scope erstellen; der Klartext steht nur in dieser Antwort (Audit auth.api_token.created)
      description: |
        Minimalstand: einziger Scope ist dms.upload (Share-/Scan-API). Pflichtablauf (expires_in_days 1..730, Standard 365). Gespeichert wird nur der SHA-256-Hash.
        Das Token (Praefix lhp_) wird ausschliesslich an Routen mit ausdruecklichem Scope akzeptiert, nie als Sitzung. Unbekannter Scope 422.
      security: [{ bearer: [] }, { cookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                scopes: { type: array, minItems: 1, items: { type: string, enum: [dms.upload] } }
                expires_in_days: { type: integer, minimum: 1, maximum: 730 }
      responses:
        "201":
          description: Token inklusive Klartext (nur jetzt sichtbar)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiToken" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/auth/api-tokens/{token}:
    delete:
      operationId: revokeApiToken
      summary: Eigenes API-Token widerrufen (wirkt sofort auf allen Instanzen; wiederholbar; fremde ID 404; Audit auth.api_token.revoked)
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { name: token, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Widerrufen }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/tenants/{tenant}/dms/share:
    post:
      operationId: dmsShare
      summary: Share-/Scan-API (WP-D4). Datei hochladen mit persoenlichem API-Token (Scope dms.upload); Berechtigung dms.document.create der Rolle des Token-Inhabers
      description: |
        Wie dmsUpload (Body = Dateiinhalt, Magic Bytes, Limits, Quota, gleiche Query-Parameter), aber Authorization: Bearer lhp_... statt Sitzung; Cookies und Sitzungstokens werden hier nicht akzeptiert.
        Der Idempotency-Key ist optional (Scanner kennen ihn nicht): ohne ihn gilt ein aus Inhalt und Parametern abgeleiteter Schluessel, dieselbe Datei erzeugt dann kein zweites Dokument,
        sondern liefert die Antwort des ersten Aufrufs. Quelle des Eingangsvorgangs ist share_ext, Herkunft api_token:<id>.
        Ungueltiges, widerrufenes, abgelaufenes Token oder falscher Scope 401; Token-Inhaber kein Mitglied des Mandanten 404; Modul aus 404 module_disabled; Rolle ohne Recht 403.
      security: [{ apiToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string, minLength: 1, maxLength: 255 } }
        - { name: filename, in: query, schema: { type: string, maxLength: 255 } }
        - { name: title, in: query, schema: { type: string, maxLength: 300 } }
        - { name: doc_date, in: query, schema: { type: string, format: date } }
        - { name: document_type_id, in: query, schema: { type: string, format: uuid } }
        - { name: archive, in: query, schema: { type: boolean, default: false } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Dokument angelegt (oder gespeicherte Antwort bei Wiederholung)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DmsDocument" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/tenants/{tenant}/dms/sources:
    get:
      operationId: listDmsSources
      summary: Quellen des Mandanten (Berechtigung dms.source.read) mit letztem Lauf und Fehlercode; nie mit Geheimnis
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
      responses:
        "200":
          description: Quellen (hoechstens 50 je Mandant), aelteste zuerst
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/DmsSource" } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createDmsSource
      summary: Quelle anlegen (Berechtigung dms.source.manage); Audit dms.source.created, plant den ersten Lauf ein
      description: |
        kind mail: IMAP ueber implizites TLS (config.host, port 993, username, mailbox INBOX, processed_mailbox, interval_seconds 30..86400, include_body, sender_contains, subject_contains,
        max_per_run) und password (Pflicht). Das Passwort wird mit AES-256-GCM verschluesselt (Schluessel aus SECRET_KEY, Betrieb) gespeichert und nie ausgegeben, geloggt oder auditiert
        (Antwort: has_secret). Ohne SECRET_KEY auf dem Server: 422 mit Feld password und Code secret_key_missing (5xx-Details gibt die API nie aus). Verarbeitet werden ungelesene Nachrichten; danach als gelesen markiert und optional verschoben, nie geloescht.
        kind folder: config.path relativ zum Mount <DMS_FOLDER_ROOT>/<mandant>/ im Worker-Container (nur [A-Za-z0-9_. -] und /), interval_seconds 10..86400, stable_seconds 0..3600.
        Unbekannte Schluessel 422, gleicher Name 409, mehr als 50 Quellen 409.
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DmsSourceInput" }
      responses:
        "201":
          description: Quelle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DmsSource" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/tenants/{tenant}/dms/sources/{source}:
    get:
      operationId: getDmsSource
      summary: Quelle mit letztem Lauf (Berechtigung dms.source.read); fremde ID 404
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
        - { $ref: "#/components/parameters/DmsSource" }
      responses:
        "200":
          description: Quelle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DmsSource" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateDmsSource
      summary: Quelle aendern (Berechtigung dms.source.manage); name, config (komplett), password, enabled; Audit dms.source.updated
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
        - { $ref: "#/components/parameters/DmsSource" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                config: { type: object, additionalProperties: true }
                password: { type: string, minLength: 1, maxLength: 512 }
                enabled: { type: boolean }
      responses:
        "200":
          description: Quelle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DmsSource" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteDmsSource
      summary: Quelle loeschen (Berechtigung dms.source.manage); bereits aufgenommene Dokumente bleiben; Audit dms.source.deleted
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
        - { $ref: "#/components/parameters/DmsSource" }
      responses:
        "204": { description: Geloescht }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/tenants/{tenant}/dms/sources/{source}/run:
    post:
      operationId: runDmsSource
      summary: Lauf sofort einplanen (Berechtigung dms.source.manage); zieht den wartenden Lauf vor, hoechstens ein offener Lauf je Quelle; Audit dms.source.run_requested
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
        - { $ref: "#/components/parameters/DmsSource" }
      responses:
        "202":
          description: Eingeplant (Ergebnis spaeter in last_run_at/last_status)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DmsSource" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/tenants/{tenant}/dms/sources/{source}/test:
    post:
      operationId: testDmsSource
      summary: Verbindung testen (Berechtigung dms.source.manage); nur Mail - Anmeldung und Postfach, keine Verarbeitung
      description: |
        Antwort immer 200 mit ok; bei Fehler nur ein Code (imap_connect_failed, imap_tls_failed, imap_auth_failed, imap_mailbox_not_found, imap_timeout, secret_key_missing, secret_unreadable), nie Servertext oder Passwort.
        Ordnerquellen koennen vom Backend nicht geprueft werden (der Ordner ist nur im Worker eingebunden): 409 mit detail test_not_supported; Ergebnis dort ueber last_status nach einem Lauf.
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
        - { $ref: "#/components/parameters/DmsSource" }
      responses:
        "200":
          description: Testergebnis
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  unseen: { type: integer, description: "Anzahl ungelesener Nachrichten, die passen (nur bei ok)" }
                  error: { type: string }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  # --- WP-D6: Paperless-Import, Notizen ---
  /api/v1/tenants/{tenant}/dms/imports:
    post:
      operationId: startDmsImport
      summary: Import-Lauf anlegen (Berechtigung dms.import.manage)
      description: |
        Reiht den Worker-Job dms.import.paperless ein (202). Quelle export: Verzeichnis eines document_exporter-Exports im Worker unter DMS_IMPORT_ROOT/<mandant>/<pfad> (manifest.json + Dateien);
        Quelle api: REST-API einer Paperless-ngx-Instanz (nur GET, Token im Header, nur https mit Zertifikatspruefung, Host-Allowlist DMS_IMPORT_HOST_ALLOWLIST, keine Weiterleitungen).
        Das Token wird sofort verschluesselt (SecretBox) und nie zurueckgegeben. Modus dry_run schreibt nichts ins DMS (nur Bericht); import ist idempotent (Schluessel Quelle + Paperless-ID, Hash) und
        wird durch einen neuen Lauf gegen dieselbe Quelle fortgesetzt. Rechte/Besitzer der Quelle werden nie uebernommen, Matching-Regeln nur als Vorschlaege im Bericht (F-23).
        409 conflict (detail import_already_open), wenn fuer dieselbe Quelle ein Lauf wartet oder laeuft.
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DmsImportInput" }
      responses:
        "202": { description: Lauf angelegt, content: { application/json: { schema: { $ref: "#/components/schemas/DmsImport" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    get:
      operationId: listDmsImports
      summary: Letzte 50 Import-Laeufe (Berechtigung dms.import.read)
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
      responses:
        "200":
          description: Laeufe, neueste zuerst
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/DmsImport" } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/tenants/{tenant}/dms/imports/{import}:
    get:
      operationId: getDmsImport
      summary: Status und Fortschritt eines Import-Laufs (Berechtigung dms.import.read)
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
        - { $ref: "#/components/parameters/DmsImport" }
      responses:
        "200": { description: Lauf, content: { application/json: { schema: { $ref: "#/components/schemas/DmsImport" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/tenants/{tenant}/dms/imports/{import}/report:
    get:
      operationId: getDmsImportReport
      summary: Importbericht als JSON-Datei (Berechtigung dms.import.read); 404 bis der Lauf beendet ist
      description: |
        Bericht (format labhub-paperless-import-report/1): Zaehler, Befunde je Code (Konflikte, Warnungen, Hinweise, je Code die ersten 100 Eintraege mit Gesamtzahl),
        ASN-Stand, Rechte-Zaehler (nicht uebernommen) und Regelvorschlaege. Auch bei abgebrochenen und fehlgeschlagenen Laeufen.
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
        - { $ref: "#/components/parameters/DmsImport" }
      responses:
        "200":
          description: Bericht (Anhang, nosniff, no-store)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DmsImportReport" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/tenants/{tenant}/dms/imports/{import}/cancel:
    post:
      operationId: cancelDmsImport
      summary: Import-Lauf abbrechen (Berechtigung dms.import.manage)
      description: "Wartender Lauf wird sofort cancelled. Ein laufender Lauf endet vor dem naechsten Dokument (bereits Importiertes bleibt, ein neuer Lauf setzt fort). Beendeter Lauf: 409."
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
        - { $ref: "#/components/parameters/DmsImport" }
      responses:
        "200": { description: Lauf, content: { application/json: { schema: { $ref: "#/components/schemas/DmsImport" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/tenants/{tenant}/dms/documents/{document}/notes:
    get:
      operationId: listDmsDocumentNotes
      summary: Notizen eines Dokuments (Berechtigung dms.document.read); entstehen durch den Paperless-Import
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
        - { name: document, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Notizen, aelteste zuerst
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/DmsNote" } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, description: "Sitzungstoken fuer Apps (Header X-Auth-Transport: bearer bei der Anmeldung)" }
    apiToken: { type: http, scheme: bearer, description: "Persoenliches API-Token (Praefix lhp_) mit Scope; nur an Routen mit ausdruecklichem Scope (WP-D4, Minimalstand F-05)" }
    cookie: { type: apiKey, in: cookie, name: lh_session, description: "HttpOnly-Cookie der PWA; schreibende Methoden brauchen X-CSRF-Token" }
  headers:
    XRequestId:
      description: Korrelations-ID der Anfrage; eine gueltige eingehende ID wird uebernommen.
      schema: { type: string, maxLength: 64, pattern: "^[A-Za-z0-9._-]+$" }
  parameters:
    Tenant:
      name: tenant
      in: path
      required: true
      description: Mandant. Kein Mitglied, unbekannt oder ungueltig liefert 404.
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: Opaker Cursor aus next_cursor der vorigen Seite.
      schema: { type: string }
    Count:
      name: count
      in: query
      description: Gesamtzahl nur auf Anforderung (teuer).
      schema: { type: boolean, default: false }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Pflicht bei finalisierenden POSTs. Gleicher Key + gleicher Request = gespeicherte Antwort; anderer Request = 422 idempotency_key_reused.
      schema: { type: string, minLength: 1, maxLength: 255 }
    Contact:
      name: contact
      in: path
      required: true
      schema: { type: string, format: uuid }
    LinkId:
      name: link
      in: path
      required: true
      schema: { type: string, format: uuid }
    DmsDocument:
      name: document
      in: path
      required: true
      schema: { type: string, format: uuid }
    DmsMasterId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    DmsRule:
      name: rule
      in: path
      required: true
      schema: { type: string, format: uuid }
    DmsSuggestion:
      name: suggestion
      in: path
      required: true
      schema: { type: string, format: uuid }
    DmsSource:
      name: source
      in: path
      required: true
      description: Quelle des Mandanten. Fremd oder unbekannt liefert 404.
      schema: { type: string, format: uuid }
    DmsImport:
      name: import
      in: path
      required: true
      description: Import-Lauf des Mandanten. Fremd oder unbekannt liefert 404.
      schema: { type: string, format: uuid }
    DmsDuplicate:
      name: duplicate
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Problem:
      description: Fehler (RFC 9457)
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PasskeyOptions:
      description: WebAuthn-Optionen fuer navigator.credentials.create/get plus challenge_id (Challenge einmalig, 5 Minuten gueltig)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PasskeyOptionsResponse" }
    Session:
      description: Sitzung. Bei Anmeldung wird das Cookie lh_session gesetzt (HttpOnly, SameSite=Lax), mit Header X-Auth-Transport bearer stattdessen token im Body.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SessionResponse" }
  schemas:
    PasskeyOptionsResponse:
      type: object
      required: [challenge_id, public_key]
      properties:
        challenge_id: { type: string, format: uuid }
        public_key: { type: object, description: "PublicKeyCredentialCreationOptions bzw. RequestOptions (JSON)" }
    PasskeyVerifyRequest:
      type: object
      required: [challenge_id, credential]
      properties:
        challenge_id: { type: string, format: uuid }
        credential: { type: object, description: "Ergebnis von navigator.credentials.create/get (Base64URL-Felder)" }
        name: { type: string, minLength: 1, maxLength: 80, description: "Nur beim Anlegen weiterer Passkeys" }
    BootstrapOptionsRequest:
      type: object
      required: [setup_token, handle, display_name]
      properties:
        setup_token: { type: string }
        handle: { type: string, pattern: "^[a-z0-9][a-z0-9._-]{2,31}$" }
        display_name: { type: string, minLength: 1, maxLength: 80 }
        tenant_name: { type: string, minLength: 1, maxLength: 80, description: "Name des ersten Mandanten (Standard Hauptmandant); der Nutzer wird Betreiber und Owner" }
    RegisterOptionsRequest:
      type: object
      required: [invite_token, handle, display_name]
      properties:
        invite_token: { type: string }
        handle: { type: string, pattern: "^[a-z0-9][a-z0-9._-]{2,31}$" }
        display_name: { type: string, minLength: 1, maxLength: 80 }
    RecoveryLoginRequest:
      type: object
      required: [handle, code]
      properties:
        handle: { type: string }
        code: { type: string }
    SessionResponse:
      type: object
      required: [user, memberships, kind, expires_at, csrf_token]
      properties:
        user:
          type: object
          required: [id, handle, display_name, is_operator]
          properties:
            id: { type: string, format: uuid }
            handle: { type: string }
            display_name: { type: string }
            is_operator: { type: boolean, description: "Betreiber duerfen Mandanten anlegen (ersetzt is_admin aus WP-K1)" }
        memberships:
          type: array
          items:
            type: object
            required: [tenant_id, name, role]
            properties:
              tenant_id: { type: string, format: uuid }
              name: { type: string }
              role: { $ref: "#/components/schemas/Role" }
        kind: { type: string, enum: [normal, recovery] }
        expires_at: { type: string, format: date-time }
        csrf_token: { type: string }
        token: { type: string, description: "Nur bei Anmeldung mit X-Auth-Transport bearer" }
    Role:
      type: string
      enum: [owner, accountant, member, tax_advisor, customer_viewer]
    TenantMembership:
      type: object
      required: [id, name, role]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
    Member:
      type: object
      required: [user_id, handle, display_name, role, created_at]
      properties:
        user_id: { type: string, format: uuid }
        handle: { type: string }
        display_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        created_at: { type: string, format: date-time }
    SessionInfo:
      type: object
      required: [id, kind, created_at, last_seen_at, expires_at, current]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [normal, recovery] }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        current: { type: boolean }
    PasskeyInfo:
      type: object
      required: [id, name, created_at, last_used_at, backed_up]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
        backed_up: { type: boolean }
    VersionInfo:
      type: object
      required: [server, api, schema]
      properties:
        server: { type: string }
        api: { type: string }
        schema: { type: [integer, "null"] }
    FieldError:
      type: object
      required: [field, code]
      properties:
        field: { type: string }
        code: { type: string }
    Problem:
      type: object
      required: [type, title, status, code, request_id]
      properties:
        type: { type: string, format: uri }
        title: { type: string, description: Deutsche Meldung }
        status: { type: integer }
        code:
          type: string
          description: Stabiler maschinenlesbarer Code
          enum:
            - bad_request
            - conflict
            - contact_merged
            - csrf_invalid
            - document_linked
            - document_not_trashed
            - document_trashed
            - forbidden
            - handle_taken
            - idempotency_in_progress
            - idempotency_key_required
            - idempotency_key_reused
            - ingest_not_failed
            - internal_error
            - invalid_cursor
            - invalid_limit
            - invitation_invalid
            - last_owner
            - last_passkey
            - legal_hold
            - login_failed
            - method_not_allowed
            - module_disabled
            - module_required_by
            - module_requires
            - module_unavailable
            - not_found
            - passkey_invalid
            - payload_too_large
            - precondition_failed
            - recovery_session_restricted
            - retention_not_expired
            - service_unavailable
            - setup_token_invalid
            - storage_quota_exceeded
            - suggestion_decided
            - suggestion_stale
            - tenant_required
            - too_many_requests
            - unauthorized
            - unsupported_media_type
            - upload_interrupted
            - validation_failed
        detail: { type: string }
        request_id: { type: string }
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    PageEnvelope:
      type: object
      description: Muster fuer Listen (items je Ressource konkretisieren).
      required: [items, next_cursor]
      properties:
        items: { type: array, items: {} }
        next_cursor: { type: [string, "null"] }
        total: { type: [integer, "null"] }
    # --- WP-K5 ---
    Address:
      type: object
      properties:
        label: { type: [string, "null"] }
        street: { type: [string, "null"] }
        postal_code: { type: [string, "null"] }
        city: { type: [string, "null"] }
        country: { type: [string, "null"], description: ISO 3166-1 alpha-2 }
    ContactEmail:
      type: object
      required: [email]
      properties:
        email: { type: string }
        label: { type: [string, "null"] }
    BankAccount:
      type: object
      required: [iban]
      properties:
        iban: { type: string, description: Normalisiert, Pruefziffer geprueft }
        bic: { type: [string, "null"] }
        holder: { type: [string, "null"] }
    ContactInput:
      type: object
      description: Anlegen verlangt kind und display_name; beim Aendern zaehlen nur gesetzte Felder. Leerer Text loescht optionale Felder. Listen ersetzen die bisherigen vollstaendig.
      properties:
        kind: { type: string, enum: [person, organization] }
        display_name: { type: string, maxLength: 200 }
        first_name: { type: string }
        last_name: { type: string }
        company_name: { type: string }
        vat_id: { type: string }
        is_customer: { type: boolean }
        is_supplier: { type: boolean }
        is_correspondent: { type: boolean }
        note: { type: string }
        addresses: { type: array, items: { $ref: "#/components/schemas/Address" } }
        emails: { type: array, items: { $ref: "#/components/schemas/ContactEmail" } }
        bank_accounts: { type: array, items: { $ref: "#/components/schemas/BankAccount" } }
        aliases: { type: array, items: { type: string }, description: Alternative Schreibweisen fuer das Matching (z. B. DMS-Korrespondent) }
    DuplicateHint:
      type: object
      required: [id, display_name, reasons]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
        reasons: { type: array, items: { type: string, enum: [vat_id, iban] } }
    Contact:
      type: object
      required: [id, kind, display_name, is_customer, is_supplier, is_correspondent, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [person, organization] }
        display_name: { type: string }
        first_name: { type: [string, "null"] }
        last_name: { type: [string, "null"] }
        company_name: { type: [string, "null"] }
        vat_id: { type: [string, "null"] }
        is_customer: { type: boolean }
        is_supplier: { type: boolean }
        is_correspondent: { type: boolean }
        note: { type: [string, "null"] }
        merged_into: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        addresses: { type: array, items: { $ref: "#/components/schemas/Address" }, description: Nur in der Einzelansicht }
        emails: { type: array, items: { $ref: "#/components/schemas/ContactEmail" } }
        bank_accounts: { type: array, items: { $ref: "#/components/schemas/BankAccount" } }
        aliases: { type: array, items: { type: string } }
        duplicates: { type: array, items: { $ref: "#/components/schemas/DuplicateHint" }, description: Nur bei Anlegen, Aendern und Zusammenfuehren }
    Link:
      type: object
      required: [id, from_type, from_id, to_type, to_id, kind, source, created_at]
      properties:
        id: { type: string, format: uuid }
        from_type: { type: string }
        from_id: { type: string, format: uuid }
        to_type: { type: string }
        to_id: { type: string, format: uuid }
        kind: { type: string }
        source: { type: string, enum: [manual, rule, import, merge, system] }
        created_by: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        removed_at: { type: [string, "null"], format: date-time }
        removed_by: { type: [string, "null"], format: uuid }
    # --- WP-D2 ---
    DmsFile:
      type: object
      required: [role, mime, size_bytes, sha256]
      properties:
        role: { type: string, enum: [original, archive, thumbnail, derivative] }
        mime: { type: string }
        size_bytes: { type: integer, format: int64 }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        page_count: { type: [integer, "null"] }
        original_name: { type: [string, "null"] }
    DmsDocument:
      type: object
      required: [id, title, received_at, status, created_at, updated_at, rev]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        doc_date: { type: [string, "null"], format: date }
        received_at: { type: string, format: date-time }
        document_type_id: { type: [string, "null"], format: uuid }
        storage_path_id: { type: [string, "null"], format: uuid }
        correspondent_id: { type: [string, "null"], format: uuid, description: "Kontakt (Kern); ueber links kind correspondent" }
        asn: { type: [integer, "null"], format: int64, description: "Archivnummer je Mandant, unveraenderlich" }
        status: { type: string, enum: [processing, needs_review, archived] }
        trashed_at: { type: [string, "null"], format: date-time }
        trash_reason: { type: [string, "null"] }
        created_by: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        rev: { type: integer, description: "Fuer If-Match" }
        tag_ids: { type: array, items: { type: string, format: uuid }, description: Nur in der Einzelansicht }
        fields: { type: object, additionalProperties: true, description: "Wert je Feldcode (nur Einzelansicht)" }
        files: { type: array, items: { $ref: "#/components/schemas/DmsFile" } }
        duplicates: { type: array, items: { type: string, format: uuid }, description: "Nur beim Upload: Dokumente mit gleichem Original" }
        ingest_item_id: { type: string, format: uuid, description: "Nur beim Upload: Eingangsvorgang; Fortschritt ueber GET .../documents/{document}/processing" }
    DmsMaster:
      type: object
      required: [id, created_at]
      description: Stammdatenzeile; Felder je Ressource (name, code, description, default_retention_years, exclusive, group_id, color, template, data_type, options).
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        created_at: { type: string, format: date-time }
      additionalProperties: true
    DmsMasterInput:
      type: object
      description: Felder je Ressource; name ist Pflicht beim Anlegen, bei custom-fields zusaetzlich code und data_type (string, int, decimal, date, bool, select, contact) und fuer select options.
      additionalProperties: true
    # --- WP-S1 ---
    DmsSearchHit:
      type: object
      required: [id, title, status, created_at, score]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        doc_date: { type: [string, "null"], format: date }
        document_type_id: { type: [string, "null"], format: uuid }
        storage_path_id: { type: [string, "null"], format: uuid }
        correspondent_id: { type: [string, "null"], format: uuid }
        asn: { type: [integer, "null"], format: int64 }
        status: { type: string, enum: [processing, needs_review, archived] }
        created_at: { type: string, format: date-time }
        score: { type: number, format: double, description: "Relevanz; Volltexttreffer >= 1, reine Tippfehler-Treffer < 1" }
        snippet: { type: [string, "null"], description: "Textauszug; Treffer zwischen U+E000 und U+E001, kein HTML" }
    DmsFacetEntry:
      type: object
      required: [value, count]
      properties:
        value: { type: string, description: "ID (document_type, tag, correspondent, storage_path) bzw. Jahr (year)" }
        count: { type: integer }
    DmsFacets:
      type: object
      properties:
        document_type: { type: array, items: { $ref: "#/components/schemas/DmsFacetEntry" } }
        tag: { type: array, items: { $ref: "#/components/schemas/DmsFacetEntry" } }
        correspondent: { type: array, items: { $ref: "#/components/schemas/DmsFacetEntry" } }
        storage_path: { type: array, items: { $ref: "#/components/schemas/DmsFacetEntry" } }
        year: { type: array, items: { $ref: "#/components/schemas/DmsFacetEntry" } }
    DmsSearchPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/DmsSearchHit" } }
        next_cursor: { type: [string, "null"] }
        total: { type: [integer, "null"] }
        facets: { $ref: "#/components/schemas/DmsFacets" }
    DmsProcessing:
      type: object
      required: [document_id, state, phase, steps, has_archive]
      properties:
        document_id: { type: string, format: uuid }
        ingest_item_id: { type: [string, "null"], format: uuid }
        state: { type: string, enum: [none, received, stored, hashed, ocr_queued, ocr_done, classified, done, failed_retryable, failed_permanent] }
        phase: { type: string, enum: [none, pending, queued, processing, done, retrying, failed] }
        error_code: { type: [string, "null"], description: "Kurzer Token (kein Freitext), nur bei Fehlerzustaenden" }
        steps:
          type: array
          items:
            type: object
            required: [state, at]
            properties:
              state: { type: string }
              at: { type: string, format: date-time }
        text:
          type: [object, "null"]
          required: [engine, lang, version, characters]
          properties:
            engine: { type: string, description: "pdftotext (Textschicht) oder ocrmypdf" }
            lang: { type: string, enum: [de, en] }
            version: { type: integer }
            characters: { type: integer }
        has_archive: { type: boolean }
        updated_at: { type: [string, "null"], format: date-time }
    DmsRetention:
      type: object
      required: [document_id, legal_hold, retention_source, trashed, blockers, can_purge, note]
      properties:
        document_id: { type: string, format: uuid }
        legal_hold: { type: boolean }
        retention_until: { type: [string, "null"], format: date, description: "Wirksames Fristende; null = keine Frist" }
        retention_source: { type: string, enum: [document_type, default, manual, none] }
        retention_override: { type: [string, "null"], format: date, description: "Manuell gesetzte Verlaengerung" }
        trashed: { type: boolean }
        blockers: { type: array, items: { type: string, enum: [document_not_trashed, legal_hold, retention_not_expired, document_linked] } }
        can_purge: { type: boolean }
        note: { type: string, description: "Hinweis: GoBD-orientiert, keine Rechtsberatung" }
    DmsPurge:
      type: object
      required: [document_id, purged_at, files_removed, blobs_removed]
      properties:
        document_id: { type: string, format: uuid }
        purged_at: { type: string, format: date-time }
        files_removed: { type: integer }
        blobs_removed: { type: integer, description: "Objekte, die im Speicher geloescht wurden (0, wenn eine andere Dateizeile noch darauf zeigt)" }
    DmsDeletionLogEntry:
      type: object
      required: [id, document_id, original_sha256, original_size, file_count, purged_at]
      properties:
        id: { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        asn: { type: [integer, "null"], format: int64 }
        document_type_id: { type: [string, "null"], format: uuid }
        doc_date: { type: [string, "null"], format: date }
        retention_until: { type: [string, "null"], format: date }
        original_sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        original_size: { type: integer, format: int64 }
        file_count: { type: integer }
        purged_by: { type: [string, "null"], format: uuid }
        purged_at: { type: string, format: date-time }
    DmsIntegrityRun:
      type: object
      required: [id, state, created_at, files_checked, files_bad]
      properties:
        id: { type: string, format: uuid }
        state: { type: string, enum: [queued, running, passed, failed, error] }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        files_checked: { type: integer }
        files_bad: { type: integer }
        chain_entries: { type: [integer, "null"], format: int64 }
        chain_ok: { type: [boolean, "null"] }
        error_code: { type: [string, "null"] }
        report:
          type: [object, "null"]
          properties:
            findings:
              type: array
              items:
                type: object
                required: [document_id, role, problem]
                properties:
                  document_id: { type: string, format: uuid }
                  role: { type: string }
                  problem: { type: string, enum: [hash_mismatch, size_mismatch, missing, record_mismatch] }
            truncated: { type: boolean }
            chain:
              type: object
              properties:
                entries: { type: integer, format: int64 }
                ok: { type: boolean }
                problem: { type: [string, "null"], enum: [hash_mismatch, prev_mismatch, missing_audit, sequence_gap, unchained_audit, head_mismatch, null] }
                broken_at_seq: { type: [integer, "null"], format: int64 }
                head: { type: string, description: "Hash des letzten Kettenglieds (Anker)" }
    DmsExportParams:
      type: object
      properties:
        document_ids: { type: array, items: { type: string, format: uuid }, minItems: 1, maxItems: 20000 }
        date_from: { type: string, format: date }
        date_to: { type: string, format: date }
        document_type_id: { type: string, format: uuid }
    DmsExport:
      type: object
      required: [id, state, params, created_at]
      properties:
        id: { type: string, format: uuid }
        state: { type: string, enum: [queued, running, done, failed] }
        params: { $ref: "#/components/schemas/DmsExportParams" }
        created_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        document_count: { type: [integer, "null"] }
        file_count: { type: [integer, "null"] }
        size_bytes: { type: [integer, "null"], format: int64 }
        sha256: { type: [string, "null"], description: "SHA-256 des ZIP" }
        manifest_sha256: { type: [string, "null"], description: "SHA-256 der manifest.json im ZIP" }
        error_code: { type: [string, "null"], description: "integrity_failed, export_too_large, export_failed" }
    # --- WP-D3 ---
    DmsRuleCondition:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type: { type: string, enum: [text_contains, text_regex, filename_contains, filename_regex, sender_contains, source_is] }
        value: { type: string, maxLength: 200, description: "fuer *_contains; bei source_is upload|folder|mail|share_ext|api" }
        pattern: { type: string, maxLength: 200, description: "fuer *_regex (mit Zeitlimit)" }
        case_sensitive: { type: boolean, default: false }
    DmsRuleConditions:
      type: object
      required: [conditions]
      additionalProperties: false
      properties:
        version: { type: integer, enum: [1] }
        match: { type: string, enum: [all, any], default: all }
        conditions: { type: array, minItems: 1, maxItems: 20, items: { $ref: "#/components/schemas/DmsRuleCondition" } }
    DmsRuleActions:
      type: object
      additionalProperties: false
      description: Mindestens eine Aktion. Verweise muessen zum Mandanten gehoeren.
      properties:
        correspondent_id: { type: string, format: uuid }
        document_type_id: { type: string, format: uuid }
        tag_ids: { type: array, maxItems: 20, items: { type: string, format: uuid } }
        storage_path_id: { type: string, format: uuid }
        doc_date: { type: string, description: "extracted (erstes gueltiges Datum im Text) oder yyyy-MM-dd" }
        title_template: { type: string, maxLength: 300, description: "Platzhalter {filename}, {match}, {date}" }
    DmsRuleInput:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 100 }
        priority: { type: integer, minimum: -1000, maximum: 1000, default: 0, description: "hoehere zuerst" }
        enabled: { type: boolean, default: true }
        mode: { type: string, enum: [suggest, auto], default: suggest }
        confidence: { type: number, minimum: 0, maximum: 1, default: 0.8 }
        conditions: { $ref: "#/components/schemas/DmsRuleConditions" }
        actions: { $ref: "#/components/schemas/DmsRuleActions" }
        limit: { type: integer, minimum: 1, maximum: 500, description: "nur Trockenlauf" }
    DmsRule:
      type: object
      required: [id, name, priority, enabled, mode, confidence, conditions, actions, version, created_at, updated_at, stats]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        priority: { type: integer }
        enabled: { type: boolean }
        mode: { type: string, enum: [suggest, auto] }
        confidence: { type: number }
        conditions: { $ref: "#/components/schemas/DmsRuleConditions" }
        actions: { $ref: "#/components/schemas/DmsRuleActions" }
        version: { type: integer }
        created_by: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        stats:
          type: object
          required: [suggested, open, accepted, rejected, automatic]
          properties:
            suggested: { type: integer }
            open: { type: integer }
            accepted: { type: integer }
            rejected: { type: integer }
            automatic: { type: integer }
    DmsRulePage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/DmsRule" } }
        next_cursor: { type: [string, "null"] }
        total: { type: [integer, "null"] }
    DmsRulePreview:
      type: object
      required: [mode, checked, matched, timed_out, truncated, items]
      properties:
        rule_id: { type: [string, "null"], format: uuid }
        mode: { type: string, enum: [suggest, auto] }
        checked: { type: integer }
        matched: { type: integer }
        timed_out: { type: integer, description: "Dokumente, bei denen ein Regex das Zeitlimit ueberschritt" }
        truncated: { type: boolean }
        items:
          type: array
          description: Hoechstens 100 Treffer.
          items:
            type: object
            required: [document_id, title, matches, suggestions]
            properties:
              document_id: { type: string, format: uuid }
              title: { type: string }
              matches:
                type: array
                items:
                  type: object
                  required: [type, matched]
                  properties:
                    type: { type: string }
                    matched: { type: string, description: "gekuerzter Fundtext" }
                    offset: { type: [integer, "null"], description: "UTF-16-Offset im Text" }
                    length: { type: [integer, "null"] }
              suggestions:
                type: array
                items:
                  type: object
                  required: [kind, value, confidence, reason]
                  properties:
                    kind: { type: string }
                    value: { type: object, additionalProperties: { type: string } }
                    confidence: { type: number }
                    reason: { type: string }
    DmsSuggestion:
      type: object
      required: [id, document_id, document_title, kind, value, source, confidence, reason, evidence, state, applied_automatically, created_at]
      properties:
        id: { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        document_title: { type: string }
        kind: { type: string, enum: [correspondent, type, tag, date, title, path] }
        value: { type: object, additionalProperties: { type: string }, description: "z. B. {contact_id}, {document_type_id}, {tag_id}, {doc_date}, {title}, {storage_path_id}" }
        source: { type: string, enum: [rule, contact_match] }
        rule_id: { type: [string, "null"], format: uuid }
        rule_version: { type: [integer, "null"] }
        confidence: { type: number, minimum: 0, maximum: 1 }
        reason: { type: string, description: "z. B. Regel \"X\", Treffer \"Y\" oder Kontakt-Abgleich, Treffer IBAN ...1234" }
        evidence: { type: object, additionalProperties: { type: string } }
        state: { type: string, enum: [open, accepted, rejected] }
        applied_automatically: { type: boolean }
        decided_by: { type: [string, "null"], format: uuid }
        decided_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    DmsSuggestionPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/DmsSuggestion" } }
        next_cursor: { type: [string, "null"] }
        total: { type: [integer, "null"] }
    DmsDuplicate:
      type: object
      required: [id, document_id, document_title, duplicate_of, duplicate_of_title, method, score, state, created_at]
      properties:
        id: { type: string, format: uuid }
        document_id: { type: string, format: uuid, description: "das jeweils juengere Dokument" }
        document_title: { type: string }
        duplicate_of: { type: string, format: uuid }
        duplicate_of_title: { type: string }
        method: { type: string, enum: [sha256, text_hash, similarity] }
        score: { type: number, minimum: 0, maximum: 1 }
        state: { type: string, enum: [open, confirmed, dismissed] }
        decided_by: { type: [string, "null"], format: uuid }
        decided_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    DmsDuplicatePage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/DmsDuplicate" } }
        next_cursor: { type: [string, "null"] }
        total: { type: [integer, "null"] }
    ApiToken:
      type: object
      required: [id, name, scopes, expires_at, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        scopes: { type: array, items: { type: string, enum: [dms.upload] } }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        token: { type: string, description: "Klartext, nur in der Antwort von createApiToken" }
    DmsImportInput:
      type: object
      required: [source, mode]
      additionalProperties: false
      properties:
        mode: { type: string, enum: [dry_run, import] }
        source:
          type: object
          required: [kind]
          additionalProperties: false
          properties:
            kind: { type: string, enum: [export, api] }
            path: { type: string, maxLength: 200, description: "nur kind export: relativer Pfad unter DMS_IMPORT_ROOT/<mandant>/ (ohne .., ohne fuehrenden Punkt)" }
            base_url: { type: string, maxLength: 300, description: "nur kind api: https-URL der Instanz, ohne Zugangsdaten, Query und Fragment" }
            token: { type: string, minLength: 1, maxLength: 500, description: "nur kind api, Pflicht; wird verschluesselt und nie zurueckgegeben" }
        options:
          type: object
          additionalProperties: false
          properties:
            ocr: { type: boolean, default: true, description: "OCR-Job fuer Dokumente ohne uebernommenen Text" }
    DmsImport:
      type: object
      required: [id, source_kind, mode, state, cancel_requested, config, has_secret, progress, requested_by, created_at]
      properties:
        id: { type: string, format: uuid }
        source_kind: { type: string, enum: [export, api] }
        mode: { type: string, enum: [dry_run, import] }
        state: { type: string, enum: [queued, running, done, failed, cancelled] }
        cancel_requested: { type: boolean }
        config: { type: object, additionalProperties: { type: string }, description: "path bzw. base_url, nie das Token" }
        has_secret: { type: boolean }
        progress: { type: object, additionalProperties: { type: integer }, description: "processed, total und die Zaehler des Laufs" }
        error_code: { type: [string, "null"], description: "bei failed: import_root_missing, source_not_found, manifest_missing, manifest_too_large, manifest_invalid, invalid_url, scheme_not_allowed, host_not_allowed, source_auth_failed, source_unreachable, source_tls_failed, source_http_error, source_response_invalid, secret_key_missing, secret_unreadable, storage_quota_exceeded, module_disabled, import_failed" }
        requested_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
    DmsImportReport:
      type: object
      required: [format, mode, source_kind, state, counts, findings, asn, rights, rule_suggestions]
      properties:
        format: { type: string, example: "labhub-paperless-import-report/1" }
        mode: { type: string, enum: [dry_run, import] }
        source_kind: { type: string, enum: [export, api] }
        state: { type: string, enum: [done, failed, cancelled] }
        error_code: { type: string }
        counts: { type: object, additionalProperties: { type: integer }, description: "u. a. documents_seen, documents_would_import bzw. documents_imported, documents_skipped_existing, documents_skipped, files_original, files_archive, files_without_checksum, asn_collisions, <art>_created|would_create|matched|merged|existing" }
        findings:
          type: object
          description: "je Code: total und die ersten 100 Eintraege (ref = Art:Paperless-ID, detail kurz). Codes u. a. asn_collision, file_without_checksum, file_missing, checksum_mismatch, unsupported_type, file_too_large, hash_exists, duplicate_hash_imported, contact_possible_duplicate, reference_matched_by_name, tag_similar, storage_path_untranslatable, custom_field_unsupported, custom_field_type_conflict, monetary_currency_dropped, reference_unknown, document_failed"
          additionalProperties:
            type: object
            required: [total, items]
            properties:
              total: { type: integer }
              items: { type: array, items: { type: object, required: [ref], properties: { ref: { type: string }, detail: { type: string } } } }
        asn:
          type: object
          required: [max_seen, collisions]
          properties:
            max_seen: { type: integer, format: int64 }
            collisions: { type: integer }
            counter_value: { type: [integer, "null"], format: int64, description: "Stand des Zaehlers dms:asn nach dem Lauf (mindestens das Maximum der Quelle)" }
        rights:
          type: object
          required: [imported, note_code]
          properties:
            imported: { type: boolean, description: "immer false (F-23): Besitzer und Berechtigungen werden nicht uebernommen" }
            note_code: { type: string, example: rights_not_imported }
            owners_seen: { type: integer }
            source_users: { type: integer }
            source_groups: { type: integer }
        rule_suggestions:
          type: array
          description: "Matching-Algorithmen der Quelle als Vorschlaege fuer dms_rules; nie automatisch angelegt"
          items:
            type: object
            properties:
              target_kind: { type: string, enum: [correspondent, document_type, tag, storage_path] }
              target_name: { type: string }
              algorithm: { type: string, enum: [none, any, all, literal, regex, fuzzy, auto, unknown] }
              match: { type: string }
              case_insensitive: { type: boolean }
              translatable: { type: boolean }
    DmsNote:
      type: object
      required: [id, body, created_at]
      properties:
        id: { type: string, format: uuid }
        body: { type: string }
        noted_at: { type: [string, "null"], format: date-time }
        origin: { type: [string, "null"], description: "z. B. paperless:note:<id>" }
        created_at: { type: string, format: date-time }
    DmsSource:
      type: object
      required: [id, kind, name, config, has_secret, enabled, runs, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [mail, folder] }
        name: { type: string }
        config: { type: object, additionalProperties: true, description: "ohne Geheimnisse" }
        has_secret: { type: boolean, description: "ein Passwort ist hinterlegt (nie der Wert)" }
        enabled: { type: boolean }
        runs: { type: integer, format: int64 }
        last_run_at: { type: [string, "null"], format: date-time }
        last_status: { type: [string, "null"], enum: [ok, error, null] }
        last_error: { type: [string, "null"], description: "Fehlercode des letzten Laufs, keine Nutzdaten" }
        last_stats:
          type: [object, "null"]
          description: "Zaehler des letzten Laufs (Mail: messages, ingested, duplicates, skipped, failed; Ordner: files, ingested, duplicates, waiting, failed)"
          additionalProperties: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DmsSourceInput:
      type: object
      required: [kind, name, config]
      properties:
        kind: { type: string, enum: [mail, folder] }
        name: { type: string, minLength: 1, maxLength: 100 }
        config: { type: object, additionalProperties: true }
        password: { type: string, minLength: 1, maxLength: 512, description: "nur kind mail, Pflicht; wird nie zurueckgegeben" }
        enabled: { type: boolean, default: true }
