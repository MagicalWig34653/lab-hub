  /api/v1/tenants/{tenant}/dms/integrity-runs:
    post:
      operationId: startDmsIntegrityRun
      summary: Integritaetspruefung starten (Berechtigung dms.integrity.run)
      description: |
        Reiht den Worker-Job dms.verify ein (202). Der Job liest jedes Objekt des Mandanten aus dem Objektspeicher und vergleicht SHA-256 und Groesse mit der Datenbank, danach prueft er die Hash-Kette
        des Audit-Logs. Abweichung = Zustand failed, Bericht mit Dokument, Rolle und Art (hash_mismatch, size_mismatch, missing, record_mismatch) und Audit dms.integrity.failed.
        Ein Zeitplaner ist nicht Teil des Hubs; periodische Laeufe loest ein externer Aufruf aus.
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
      responses:
        "202": { description: Lauf angelegt, content: { application/json: { schema: { $ref: "#/components/schemas/DmsIntegrityRun" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    get:
      operationId: listDmsIntegrityRuns
      summary: Letzte 50 Pruefungen (Berechtigung dms.integrity.run)
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
      responses:
        "200":
          description: Laeufe, neueste zuerst
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/DmsIntegrityRun" } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/tenants/{tenant}/dms/integrity-runs/{run}:
    get:
      operationId: getDmsIntegrityRun
      summary: Pruefbericht (Berechtigung dms.integrity.run)
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
        - { name: run, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Lauf, content: { application/json: { schema: { $ref: "#/components/schemas/DmsIntegrityRun" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/tenants/{tenant}/dms/exports:
    post:
      operationId: startDmsExport
      summary: Export starten (Berechtigung dms.export.run)
      description: |
        Reiht den Worker-Job dms.export ein (202). Ergebnis: ZIP mit documents/<ASN>/<rolle>-<titel>.<ext>, index.csv und manifest.json (SHA-256 und Groesse je Datei, Kopf der Hash-Kette).
        Papierkorb ist nicht enthalten. Jede Datei wird beim Packen gegen den gespeicherten Hash geprueft; Abweichung = Export failed (integrity_failed). Keine Konformitaetsaussage.
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DmsExportParams" }
      responses:
        "202": { description: Export angelegt, content: { application/json: { schema: { $ref: "#/components/schemas/DmsExport" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    get:
      operationId: listDmsExports
      summary: Letzte 50 Exporte (Berechtigung dms.export.run)
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
      responses:
        "200":
          description: Exporte, neueste zuerst
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/DmsExport" } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/tenants/{tenant}/dms/exports/{export}:
    get:
      operationId: getDmsExport
      summary: Exportstatus (Berechtigung dms.export.run)
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
        - { name: export, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Export, content: { application/json: { schema: { $ref: "#/components/schemas/DmsExport" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/tenants/{tenant}/dms/exports/{export}/file:
    get:
      operationId: downloadDmsExport
      summary: ZIP herunterladen (Berechtigung dms.export.run); 404 solange der Export nicht fertig ist
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
        - { name: export, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: ZIP-Archiv (Stream). SHA-256 des Archivs steht im Exportdatensatz, die der Dateien im Manifest.
          content:
            application/zip:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, description: "Sitzungstoken fuer Apps (Header X-Auth-Transport: bearer bei der Anmeldung)" }
    cookie: { type: apiKey, in: cookie, name: lh_session, description: "HttpOnly-Cookie der PWA; schreibende Methoden brauchen X-CSRF-Token" }
  headers:
    XRequestId:
      description: Korrelations-ID der Anfrage; eine gueltige eingehende ID wird uebernommen.
      schema: { type: string, maxLength: 64, pattern: "^[A-Za-z0-9._-]+$" }
  parameters:
    Tenant:
      name: tenant
      in: path
      required: true
      description: Mandant. Kein Mitglied, unbekannt oder ungueltig liefert 404.
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: Opaker Cursor aus next_cursor der vorigen Seite.
      schema: { type: string }
    Count:
      name: count
      in: query
      description: Gesamtzahl nur auf Anforderung (teuer).
      schema: { type: boolean, default: false }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Pflicht bei finalisierenden POSTs. Gleicher Key + gleicher Request = gespeicherte Antwort; anderer Request = 422 idempotency_key_reused.
      schema: { type: string, minLength: 1, maxLength: 255 }
    Contact:
      name: contact
      in: path
      required: true
      schema: { type: string, format: uuid }
    LinkId:
      name: link
      in: path
      required: true
      schema: { type: string, format: uuid }
    DmsDocument:
      name: document
      in: path
      required: true
      schema: { type: string, format: uuid }
    DmsMasterId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Problem:
      description: Fehler (RFC 9457)
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PasskeyOptions:
      description: WebAuthn-Optionen fuer navigator.credentials.create/get plus challenge_id (Challenge einmalig, 5 Minuten gueltig)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PasskeyOptionsResponse" }
    Session:
      description: Sitzung. Bei Anmeldung wird das Cookie lh_session gesetzt (HttpOnly, SameSite=Lax), mit Header X-Auth-Transport bearer stattdessen token im Body.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SessionResponse" }
  schemas:
    PasskeyOptionsResponse:
      type: object
      required: [challenge_id, public_key]
      properties:
        challenge_id: { type: string, format: uuid }
        public_key: { type: object, description: "PublicKeyCredentialCreationOptions bzw. RequestOptions (JSON)" }
    PasskeyVerifyRequest:
      type: object
      required: [challenge_id, credential]
      properties:
        challenge_id: { type: string, format: uuid }
        credential: { type: object, description: "Ergebnis von navigator.credentials.create/get (Base64URL-Felder)" }
        name: { type: string, minLength: 1, maxLength: 80, description: "Nur beim Anlegen weiterer Passkeys" }
    BootstrapOptionsRequest:
      type: object
      required: [setup_token, handle, display_name]
      properties:
        setup_token: { type: string }
        handle: { type: string, pattern: "^[a-z0-9][a-z0-9._-]{2,31}$" }
        display_name: { type: string, minLength: 1, maxLength: 80 }
        tenant_name: { type: string, minLength: 1, maxLength: 80, description: "Name des ersten Mandanten (Standard Hauptmandant); der Nutzer wird Betreiber und Owner" }
    RegisterOptionsRequest:
      type: object
      required: [invite_token, handle, display_name]
      properties:
        invite_token: { type: string }
        handle: { type: string, pattern: "^[a-z0-9][a-z0-9._-]{2,31}$" }
        display_name: { type: string, minLength: 1, maxLength: 80 }
    RecoveryLoginRequest:
      type: object
      required: [handle, code]
      properties:
        handle: { type: string }
        code: { type: string }
    SessionResponse:
      type: object
      required: [user, memberships, kind, expires_at, csrf_token]
      properties:
        user:
          type: object
          required: [id, handle, display_name, is_operator]
          properties:
            id: { type: string, format: uuid }
            handle: { type: string }
            display_name: { type: string }
            is_operator: { type: boolean, description: "Betreiber duerfen Mandanten anlegen (ersetzt is_admin aus WP-K1)" }
        memberships:
          type: array
          items:
            type: object
            required: [tenant_id, name, role]
            properties:
              tenant_id: { type: string, format: uuid }
              name: { type: string }
              role: { $ref: "#/components/schemas/Role" }
        kind: { type: string, enum: [normal, recovery] }
        expires_at: { type: string, format: date-time }
        csrf_token: { type: string }
        token: { type: string, description: "Nur bei Anmeldung mit X-Auth-Transport bearer" }
    Role:
      type: string
      enum: [owner, accountant, member, tax_advisor, customer_viewer]
    TenantMembership:
      type: object
      required: [id, name, role]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
    Member:
      type: object
      required: [user_id, handle, display_name, role, created_at]
      properties:
        user_id: { type: string, format: uuid }
        handle: { type: string }
        display_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        created_at: { type: string, format: date-time }
    SessionInfo:
      type: object
      required: [id, kind, created_at, last_seen_at, expires_at, current]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [normal, recovery] }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        current: { type: boolean }
    PasskeyInfo:
      type: object
      required: [id, name, created_at, last_used_at, backed_up]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
        backed_up: { type: boolean }
    VersionInfo:
      type: object
      required: [server, api, schema]
      properties:
        server: { type: string }
        api: { type: string }
        schema: { type: [integer, "null"] }
    FieldError:
      type: object
      required: [field, code]
      properties:
        field: { type: string }
        code: { type: string }
    Problem:
      type: object
      required: [type, title, status, code, request_id]
      properties:
        type: { type: string, format: uri }
        title: { type: string, description: Deutsche Meldung }
        status: { type: integer }
        code:
          type: string
          description: Stabiler maschinenlesbarer Code
          enum:
            - bad_request
            - conflict
            - contact_merged
            - csrf_invalid
            - document_linked
            - document_not_trashed
            - document_trashed
            - forbidden
            - handle_taken
            - idempotency_in_progress
            - idempotency_key_required
            - idempotency_key_reused
            - ingest_not_failed
            - internal_error
            - invalid_cursor
            - invalid_limit
            - invitation_invalid
            - last_owner
            - last_passkey
            - legal_hold
            - login_failed
            - method_not_allowed
            - module_disabled
            - module_required_by
            - module_requires
            - module_unavailable
            - not_found
            - passkey_invalid
            - payload_too_large
            - precondition_failed
            - recovery_session_restricted
            - retention_not_expired
            - service_unavailable
            - setup_token_invalid
            - storage_quota_exceeded
            - tenant_required
            - too_many_requests
            - unauthorized
            - unsupported_media_type
            - upload_interrupted
            - validation_failed
        detail: { type: string }
        request_id: { type: string }
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    PageEnvelope:
      type: object
      description: Muster fuer Listen (items je Ressource konkretisieren).
      required: [items, next_cursor]
      properties:
        items: { type: array, items: {} }
        next_cursor: { type: [string, "null"] }
        total: { type: [integer, "null"] }
    # --- WP-K5 ---
    Address:
      type: object
      properties:
        label: { type: [string, "null"] }
        street: { type: [string, "null"] }
        postal_code: { type: [string, "null"] }
        city: { type: [string, "null"] }
        country: { type: [string, "null"], description: ISO 3166-1 alpha-2 }
    ContactEmail:
      type: object
      required: [email]
      properties:
        email: { type: string }
        label: { type: [string, "null"] }
    BankAccount:
      type: object
      required: [iban]
      properties:
        iban: { type: string, description: Normalisiert, Pruefziffer geprueft }
        bic: { type: [string, "null"] }
        holder: { type: [string, "null"] }
    ContactInput:
      type: object
      description: Anlegen verlangt kind und display_name; beim Aendern zaehlen nur gesetzte Felder. Leerer Text loescht optionale Felder. Listen ersetzen die bisherigen vollstaendig.
      properties:
        kind: { type: string, enum: [person, organization] }
        display_name: { type: string, maxLength: 200 }
        first_name: { type: string }
        last_name: { type: string }
        company_name: { type: string }
        vat_id: { type: string }
        is_customer: { type: boolean }
        is_supplier: { type: boolean }
        is_correspondent: { type: boolean }
        note: { type: string }
        addresses: { type: array, items: { $ref: "#/components/schemas/Address" } }
        emails: { type: array, items: { $ref: "#/components/schemas/ContactEmail" } }
        bank_accounts: { type: array, items: { $ref: "#/components/schemas/BankAccount" } }
        aliases: { type: array, items: { type: string }, description: Alternative Schreibweisen fuer das Matching (z. B. DMS-Korrespondent) }
    DuplicateHint:
      type: object
      required: [id, display_name, reasons]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
        reasons: { type: array, items: { type: string, enum: [vat_id, iban] } }
    Contact:
      type: object
      required: [id, kind, display_name, is_customer, is_supplier, is_correspondent, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [person, organization] }
        display_name: { type: string }
        first_name: { type: [string, "null"] }
        last_name: { type: [string, "null"] }
        company_name: { type: [string, "null"] }
        vat_id: { type: [string, "null"] }
        is_customer: { type: boolean }
        is_supplier: { type: boolean }
        is_correspondent: { type: boolean }
        note: { type: [string, "null"] }
        merged_into: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        addresses: { type: array, items: { $ref: "#/components/schemas/Address" }, description: Nur in der Einzelansicht }
        emails: { type: array, items: { $ref: "#/components/schemas/ContactEmail" } }
        bank_accounts: { type: array, items: { $ref: "#/components/schemas/BankAccount" } }
        aliases: { type: array, items: { type: string } }
        duplicates: { type: array, items: { $ref: "#/components/schemas/DuplicateHint" }, description: Nur bei Anlegen, Aendern und Zusammenfuehren }
    Link:
      type: object
      required: [id, from_type, from_id, to_type, to_id, kind, source, created_at]
      properties:
        id: { type: string, format: uuid }
        from_type: { type: string }
        from_id: { type: string, format: uuid }
        to_type: { type: string }
        to_id: { type: string, format: uuid }
        kind: { type: string }
        source: { type: string, enum: [manual, rule, import, merge, system] }
        created_by: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        removed_at: { type: [string, "null"], format: date-time }
        removed_by: { type: [string, "null"], format: uuid }
    # --- WP-D2 ---
    DmsFile:
      type: object
      required: [role, mime, size_bytes, sha256]
      properties:
        role: { type: string, enum: [original, archive, thumbnail, derivative] }
        mime: { type: string }
        size_bytes: { type: integer, format: int64 }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        page_count: { type: [integer, "null"] }
        original_name: { type: [string, "null"] }
    DmsDocument:
      type: object
      required: [id, title, received_at, status, created_at, updated_at, rev]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        doc_date: { type: [string, "null"], format: date }
        received_at: { type: string, format: date-time }
        document_type_id: { type: [string, "null"], format: uuid }
        storage_path_id: { type: [string, "null"], format: uuid }
        correspondent_id: { type: [string, "null"], format: uuid, description: "Kontakt (Kern); ueber links kind correspondent" }
        asn: { type: [integer, "null"], format: int64, description: "Archivnummer je Mandant, unveraenderlich" }
        status: { type: string, enum: [processing, needs_review, archived] }
        trashed_at: { type: [string, "null"], format: date-time }
        trash_reason: { type: [string, "null"] }
        created_by: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        rev: { type: integer, description: "Fuer If-Match" }
        tag_ids: { type: array, items: { type: string, format: uuid }, description: Nur in der Einzelansicht }
        fields: { type: object, additionalProperties: true, description: "Wert je Feldcode (nur Einzelansicht)" }
        files: { type: array, items: { $ref: "#/components/schemas/DmsFile" } }
        duplicates: { type: array, items: { type: string, format: uuid }, description: "Nur beim Upload: Dokumente mit gleichem Original" }
        ingest_item_id: { type: string, format: uuid, description: "Nur beim Upload: Eingangsvorgang; Fortschritt ueber GET .../documents/{document}/processing" }
    DmsMaster:
      type: object
      required: [id, created_at]
      description: Stammdatenzeile; Felder je Ressource (name, code, description, default_retention_years, exclusive, group_id, color, template, data_type, options).
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        created_at: { type: string, format: date-time }
      additionalProperties: true
    DmsMasterInput:
      type: object
      description: Felder je Ressource; name ist Pflicht beim Anlegen, bei custom-fields zusaetzlich code und data_type (string, int, decimal, date, bool, select, contact) und fuer select options.
      additionalProperties: true
    # --- WP-S1 ---
    DmsSearchHit:
      type: object
      required: [id, title, status, created_at, score]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        doc_date: { type: [string, "null"], format: date }
        document_type_id: { type: [string, "null"], format: uuid }
        storage_path_id: { type: [string, "null"], format: uuid }
        correspondent_id: { type: [string, "null"], format: uuid }
        asn: { type: [integer, "null"], format: int64 }
        status: { type: string, enum: [processing, needs_review, archived] }
        created_at: { type: string, format: date-time }
        score: { type: number, format: double, description: "Relevanz; Volltexttreffer >= 1, reine Tippfehler-Treffer < 1" }
        snippet: { type: [string, "null"], description: "Textauszug; Treffer zwischen U+E000 und U+E001, kein HTML" }
    DmsFacetEntry:
      type: object
      required: [value, count]
      properties:
        value: { type: string, description: "ID (document_type, tag, correspondent, storage_path) bzw. Jahr (year)" }
        count: { type: integer }
    DmsFacets:
      type: object
      properties:
        document_type: { type: array, items: { $ref: "#/components/schemas/DmsFacetEntry" } }
        tag: { type: array, items: { $ref: "#/components/schemas/DmsFacetEntry" } }
        correspondent: { type: array, items: { $ref: "#/components/schemas/DmsFacetEntry" } }
        storage_path: { type: array, items: { $ref: "#/components/schemas/DmsFacetEntry" } }
        year: { type: array, items: { $ref: "#/components/schemas/DmsFacetEntry" } }
    DmsSearchPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/DmsSearchHit" } }
        next_cursor: { type: [string, "null"] }
        total: { type: [integer, "null"] }
        facets: { $ref: "#/components/schemas/DmsFacets" }
    DmsProcessing:
      type: object
      required: [document_id, state, phase, steps, has_archive]
      properties:
        document_id: { type: string, format: uuid }
        ingest_item_id: { type: [string, "null"], format: uuid }
        state: { type: string, enum: [none, received, stored, hashed, ocr_queued, ocr_done, classified, done, failed_retryable, failed_permanent] }
        phase: { type: string, enum: [none, pending, queued, processing, done, retrying, failed] }
        error_code: { type: [string, "null"], description: "Kurzer Token (kein Freitext), nur bei Fehlerzustaenden" }
        steps:
          type: array
          items:
            type: object
            required: [state, at]
            properties:
              state: { type: string }
              at: { type: string, format: date-time }
        text:
          type: [object, "null"]
          required: [engine, lang, version, characters]
          properties:
            engine: { type: string, description: "pdftotext (Textschicht) oder ocrmypdf" }
            lang: { type: string, enum: [de, en] }
            version: { type: integer }
            characters: { type: integer }
        has_archive: { type: boolean }
        updated_at: { type: [string, "null"], format: date-time }
    DmsRetention:
      type: object
      required: [document_id, legal_hold, retention_source, trashed, blockers, can_purge, note]
      properties:
        document_id: { type: string, format: uuid }
        legal_hold: { type: boolean }
        retention_until: { type: [string, "null"], format: date, description: "Wirksames Fristende; null = keine Frist" }
        retention_source: { type: string, enum: [document_type, default, manual, none] }
        retention_override: { type: [string, "null"], format: date, description: "Manuell gesetzte Verlaengerung" }
        trashed: { type: boolean }
        blockers: { type: array, items: { type: string, enum: [document_not_trashed, legal_hold, retention_not_expired, document_linked] } }
        can_purge: { type: boolean }
        note: { type: string, description: "Hinweis: GoBD-orientiert, keine Rechtsberatung" }
    DmsPurge:
      type: object
      required: [document_id, purged_at, files_removed, blobs_removed]
      properties:
        document_id: { type: string, format: uuid }
        purged_at: { type: string, format: date-time }
        files_removed: { type: integer }
        blobs_removed: { type: integer, description: "Objekte, die im Speicher geloescht wurden (0, wenn eine andere Dateizeile noch darauf zeigt)" }
    DmsDeletionLogEntry:
      type: object
      required: [id, document_id, original_sha256, original_size, file_count, purged_at]
      properties:
        id: { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        asn: { type: [integer, "null"], format: int64 }
        document_type_id: { type: [string, "null"], format: uuid }
        doc_date: { type: [string, "null"], format: date }
        retention_until: { type: [string, "null"], format: date }
        original_sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        original_size: { type: integer, format: int64 }
        file_count: { type: integer }
        purged_by: { type: [string, "null"], format: uuid }
        purged_at: { type: string, format: date-time }
    DmsIntegrityRun:
      type: object
      required: [id, state, created_at, files_checked, files_bad]
      properties:
        id: { type: string, format: uuid }
        state: { type: string, enum: [queued, running, passed, failed, error] }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        files_checked: { type: integer }
        files_bad: { type: integer }
        chain_entries: { type: [integer, "null"], format: int64 }
        chain_ok: { type: [boolean, "null"] }
        error_code: { type: [string, "null"] }
        report:
          type: [object, "null"]
          properties:
            findings:
              type: array
              items:
                type: object
                required: [document_id, role, problem]
                properties:
                  document_id: { type: string, format: uuid }
                  role: { type: string }
                  problem: { type: string, enum: [hash_mismatch, size_mismatch, missing, record_mismatch] }
            truncated: { type: boolean }
            chain:
              type: object
              properties:
                entries: { type: integer, format: int64 }
                ok: { type: boolean }
                problem: { type: [string, "null"], enum: [hash_mismatch, prev_mismatch, missing_audit, sequence_gap, unchained_audit, head_mismatch, null] }
                broken_at_seq: { type: [integer, "null"], format: int64 }
                head: { type: string, description: "Hash des letzten Kettenglieds (Anker)" }
    DmsExportParams:
      type: object
      properties:
        document_ids: { type: array, items: { type: string, format: uuid }, minItems: 1, maxItems: 20000 }
        date_from: { type: string, format: date }
        date_to: { type: string, format: date }
        document_type_id: { type: string, format: uuid }
    DmsExport:
      type: object
      required: [id, state, params, created_at]
      properties:
        id: { type: string, format: uuid }
        state: { type: string, enum: [queued, running, done, failed] }
        params: { $ref: "#/components/schemas/DmsExportParams" }
        created_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        document_count: { type: [integer, "null"] }
        file_count: { type: [integer, "null"] }
        size_bytes: { type: [integer, "null"], format: int64 }
        sha256: { type: [string, "null"], description: "SHA-256 des ZIP" }
        manifest_sha256: { type: [string, "null"], description: "SHA-256 der manifest.json im ZIP" }
        error_code: { type: [string, "null"], description: "integrity_failed, export_too_large, export_failed" }
