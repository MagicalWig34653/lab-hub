    InvoiceDocument:
      type: object
      required: [id, document_type_id, kind, contact_id, series_id, status, number, counter_value, issue_date, due_date, delivery_date, currency, price_mode, discount_percent, discount_amount,
                 rounding_mode, header_text, footer_text, note, net_total, tax_total, gross_total, discount_total, skonto_percent, skonto_days, tax_regime, sender, recipient, content_hash, finalized_at, rev, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        document_type_id: { type: string, format: uuid }
        kind: { type: string, enum: [quote, order_confirmation, delivery_note, invoice, credit_note] }
        contact_id: { type: [string, "null"], format: uuid }
        series_id: { type: [string, "null"], format: uuid }
        status: { type: string, enum: [draft, final, cancelled] }
        number: { type: [string, "null"], description: "Erst nach dem Finalisieren" }
        counter_value: { type: [integer, "null"] }
        issue_date: { type: string, format: date }
        due_date: { type: [string, "null"], format: date }
        delivery_date: { type: [string, "null"], format: date }
        currency: { type: string }
        price_mode: { type: string, enum: [net, gross] }
        discount_percent: { type: string }
        discount_amount: { type: [string, "null"] }
        rounding_mode: { type: string, enum: [halfAwayFromZero, halfEven, towardZero] }
        header_text: { type: [string, "null"] }
        footer_text: { type: [string, "null"] }
        note: { type: [string, "null"] }
        net_total: { type: string, description: "Dezimal-String mit 2 Nachkommastellen, vom Server berechnet" }
        tax_total: { type: string }
        gross_total: { type: string }
        discount_total: { type: string }
        skonto_percent: { type: [string, "null"] }
        skonto_days: { type: [integer, "null"] }
        tax_regime: { type: [string, "null"], enum: [standard, small_business, null] }
        sender: { type: [object, "null"], additionalProperties: true, description: "Eingefrorene Absenderdaten (Einstellungen beim Finalisieren)" }
        recipient: { type: [object, "null"], additionalProperties: true, description: "Eingefrorene Empfaengerdaten (Kontakt beim Finalisieren)" }
        content_hash: { type: [string, "null"], description: "SHA-256 (hex) ueber Inhalt, Nummer, Serie, Steuerregime, Absender und Empfaenger" }
        finalized_at: { type: [string, "null"], format: date-time }
        finalized_by: { type: [string, "null"], format: uuid }
        rev: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        lines:
          type: array
          description: "Nur in der Einzelansicht"
          items:
            type: object
            required: [id, position, kind, item_id, description, unit, quantity, second_quantity, unit_price, tax_rate, discount_kind, discount_value]
            properties:
              id: { type: string, format: uuid }
              position: { type: integer }
              kind: { type: string, enum: [item, text] }
              item_id: { type: [string, "null"], format: uuid }
              description: { type: string }
              unit: { type: [string, "null"] }
              quantity: { type: [string, "null"] }
              second_quantity: { type: [string, "null"] }
              unit_price: { type: [string, "null"] }
              tax_rate: { type: [string, "null"] }
              discount_kind: { type: [string, "null"], enum: [percent, amount, null] }
              discount_value: { type: [string, "null"] }
        charges:
          type: array
          description: "Zusatzkosten (z. B. Versand); werden nicht rabattiert. Nur in der Einzelansicht"
          items:
            type: object
            required: [id, position, description, tax_rate, amount]
            properties:
              id: { type: string, format: uuid }
              position: { type: integer }
              description: { type: string }
              tax_rate: { type: string }
              amount: { type: string }
        tax_totals:
          type: array
          description: "Summen je Steuersatz; Nur in der Einzelansicht"
          items:
            type: object
            required: [rate, net, tax, gross]
            properties:
              rate: { type: string }
              net: { type: string }
              tax: { type: string }
              gross: { type: string }
    InvoiceDocumentInput:
      type: object
      required: [document_type_id]
      additionalProperties: false
      description: "Beim Anlegen ist nur document_type_id Pflicht; beim Aendern (PATCH) sind alle Felder optional. Betraege nur als Dezimal-Strings (kein JSON-Zahlenwert)."
      properties:
        document_type_id: { type: string, format: uuid }
        contact_id: { type: [string, "null"], format: uuid }
        series_id: { type: [string, "null"], format: uuid, description: "Fehlt sie, gilt beim Finalisieren die Standardserie des Belegtyps" }
        issue_date: { type: string, format: date, description: "Standard: heute (UTC, Datenbankuhr)" }
        due_date: { type: [string, "null"], format: date }
        delivery_date: { type: [string, "null"], format: date }
        currency: { type: string, pattern: "^[A-Z]{3}$", description: "Standard: Waehrung der Einstellungen, sonst EUR" }
        price_mode: { type: string, enum: [net, gross], default: net }
        discount_percent: { type: string, pattern: "^[0-9]{1,3}(\\.[0-9]{1,4})?$", description: "0 bis 100, Belegrabatt" }
        discount_amount: { type: [string, "null"], description: "Fester Belegrabatt im Eingabemodus; hat Vorrang vor discount_percent" }
        rounding_mode: { type: string, enum: [halfAwayFromZero, halfEven, towardZero], default: halfAwayFromZero }
        header_text: { type: [string, "null"], maxLength: 5000 }
        footer_text: { type: [string, "null"], maxLength: 5000 }
        note: { type: [string, "null"], maxLength: 5000 }
        skonto_percent: { type: [string, "null"], pattern: "^[0-9]{1,2}(\\.[0-9]{1,4})?$", description: "Skontosatz, groesser 0; nur zusammen mit skonto_days" }
        skonto_days: { type: [integer, "null"], minimum: 0, maximum: 365, description: "Frist in Tagen ab Belegdatum" }
        lines:
          type: array
          maxItems: 500
          items:
            type: object
            required: [kind, description]
            additionalProperties: false
            properties:
              kind: { type: string, enum: [item, text], description: "item: Artikelposition (quantity, unit_price, tax_rate Pflicht); text: reine Textzeile" }
              item_id: { type: [string, "null"], format: uuid }
              description: { type: string, minLength: 1, maxLength: 5000 }
              unit: { type: [string, "null"], maxLength: 20 }
              quantity: { type: string }
              second_quantity: { type: [string, "null"] }
              unit_price: { type: string }
              tax_rate: { type: string }
              discount_kind: { type: [string, "null"], enum: [percent, amount, null] }
              discount_value: { type: [string, "null"] }
        charges:
          type: array
          maxItems: 50
          items:
            type: object
            required: [description, tax_rate, amount]
            additionalProperties: false
            properties:
              description: { type: string, minLength: 1, maxLength: 200 }
              tax_rate: { type: string }
              amount: { type: string }
    InvoiceDeriveInput:
      type: object
      required: [document_type_id]
      additionalProperties: false
      properties:
        document_type_id: { type: string, format: uuid, description: "Belegtyp des neuen Entwurfs" }
        issue_date: { type: string, format: date, description: "Standard: heute (UTC, Datenbankuhr)" }
    InvoiceRenderStatus:
      type: object
      required: [document_id, status]
      properties:
        document_id: { type: string, format: uuid }
        status: { type: string, enum: [ready, pending] }
        pdf_sha256: { type: string, pattern: "^[0-9a-f]{64}$", description: "Nur bei ready" }
        layout_key: { type: string, description: "Nur bei ready" }
        layout_version: { type: integer, description: "Nur bei ready" }
        renderer_version: { type: string, description: "Nur bei ready, z. B. typst 0.15.1" }
        rendered_at: { type: string, format: date-time, description: "Nur bei ready" }
    InvoiceLayoutParams:
      type: object
      description: "Layoutparameter Schema 1 (FRONTEND.md Abschnitt 13 Stufe 1). Der Designer (WP-F7b) fuehrt ein neues schema ein."
      required: [schema, base, font, colors]
      additionalProperties: false
      properties:
        schema: { type: integer, enum: [1] }
        base: { type: string, enum: [standard] }
        font: { type: string, enum: [Inter, Libertinus Serif, New Computer Modern] }
        colors:
          type: object
          required: [accent, text]
          additionalProperties: false
          properties:
            accent: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
            text: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        logo:
          type: object
          required: [sha256, width_mm, align]
          additionalProperties: false
          properties:
            sha256: { type: string, pattern: "^[0-9a-f]{64}$", description: "Logo des Mandanten (POST layouts/logos)" }
            width_mm: { type: integer, minimum: 10, maximum: 80 }
            align: { type: string, enum: [left, right] }
        texts:
          type: object
          additionalProperties: false
          description: "Platzhalter {{number}}, {{issue_date}}, {{due_date}}, {{sender}}, {{recipient}}; je hoechstens 2000 Zeichen"
          properties:
            header: { type: string, maxLength: 2000 }
            footer: { type: string, maxLength: 2000 }
    InvoiceLayout:
      type: object
      required: [id, name, version, version_id, params, created_at, updated_at, version_created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        version: { type: integer, minimum: 1 }
        version_id: { type: string, format: uuid }
        params: { $ref: "#/components/schemas/InvoiceLayoutParams" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version_created_at: { type: string, format: date-time }
    InvoiceLayoutLogo:
      type: object
      required: [sha256, content_type, width, height, size]
      properties:
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        content_type: { type: string, enum: [image/png, image/jpeg] }
        width: { type: integer }
        height: { type: integer }
        size: { type: integer }
    InvoiceLayoutAssignments:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            type: object
            required: [layout_id]
            additionalProperties: false
            properties:
              document_kind: { type: [string, "null"], enum: [quote, order_confirmation, delivery_note, invoice, credit_note, null] }
              series_id: { type: [string, "null"], format: uuid }
              layout_id: { type: string, format: uuid }
    InvoicePreview:
      type: object
      required: [id, document_id, status, expires_at]
      properties:
        id: { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        status: { type: string, enum: [pending] }
        expires_at: { type: string, format: date-time }
    InvoiceBalance:
      type: object
      required: [document_id, currency, gross_total, paid, skonto, credited, open_balance, total_balance, payment_status, skonto_terms, allocations, credit_notes]
      properties:
        document_id: { type: string, format: uuid }
        currency: { type: string }
        gross_total: { type: string }
        paid: { type: string }
        skonto: { type: string }
        credited: { type: string, description: "Summe finalisierter Gutschriften (positiv)" }
        open_balance: { type: string }
        total_balance: { type: string, description: "negativ = ueberzahlt" }
        payment_status: { type: string, enum: [open, partial, settled, overpaid] }
        skonto_terms:
          type: [object, "null"]
          required: [percent, days, deadline, amount]
          properties:
            percent: { type: string }
            days: { type: integer }
            deadline: { type: string, format: date }
            amount: { type: string, description: "hoechstes Skonto auf Brutto abzueglich Gutschriften" }
        allocations:
          type: array
          items:
            type: object
            required: [id, payment_id, paid_on, amount, skonto_amount, overpayment, confirmed_at, confirmed_by]
            properties:
              id: { type: string, format: uuid }
              payment_id: { type: string, format: uuid }
              paid_on: { type: string, format: date }
              amount: { type: string }
              skonto_amount: { type: string }
              overpayment: { type: boolean }
              confirmed_at: { type: string, format: date-time }
              confirmed_by: { type: string, format: uuid }
        credit_notes:
          type: array
          items:
            type: object
            required: [id, number, gross_total]
            properties:
              id: { type: string, format: uuid }
              number: { type: string }
              gross_total: { type: string }
    InvoiceDocumentLink:
      type: object
      required: [id, kind, direction, created_at, document]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [conversion, credit_note, reference] }
        direction: { type: string, enum: [outgoing, incoming], description: "outgoing: dieser Beleg ist Ausgangsbeleg" }
        created_at: { type: string, format: date-time }
        document:
          type: object
          required: [id, kind, status, number, issue_date, currency, gross_total]
          properties:
            id: { type: string, format: uuid }
            kind: { type: string, enum: [quote, order_confirmation, delivery_note, invoice, credit_note] }
            status: { type: string, enum: [draft, final, cancelled] }
            number: { type: [string, "null"] }
            issue_date: { type: string, format: date }
            currency: { type: string }
            gross_total: { type: string }
    InvoiceDocumentLinkInput:
      type: object
      required: [target_id]
      additionalProperties: false
      properties:
        target_id: { type: string, format: uuid }
    InvoicePayment:
      type: object
      required: [id, contact_id, paid_on, amount, currency, method, reference, note, created_at, created_by, voided_at, voided_by, void_reason, allocated, unallocated, allocations]
      properties:
        id: { type: string, format: uuid }
        contact_id: { type: [string, "null"], format: uuid }
        paid_on: { type: string, format: date }
        amount: { type: string }
        currency: { type: string }
        method: { type: string, enum: [bank_transfer, cash, card, direct_debit, other] }
        reference: { type: [string, "null"] }
        note: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        created_by: { type: string, format: uuid }
        voided_at: { type: [string, "null"], format: date-time }
        voided_by: { type: [string, "null"], format: uuid }
        void_reason: { type: [string, "null"] }
        allocated: { type: string }
        unallocated: { type: string }
        allocations:
          type: array
          description: "inklusive zurueckgenommener (revoked_at)"
          items:
            type: object
            required: [id, document_id, document_number, amount, skonto_amount, overpayment, confirmed_at, confirmed_by, revoked_at, revoked_by]
            properties:
              id: { type: string, format: uuid }
              document_id: { type: string, format: uuid }
              document_number: { type: string }
              amount: { type: string }
              skonto_amount: { type: string }
              overpayment: { type: boolean }
              confirmed_at: { type: string, format: date-time }
              confirmed_by: { type: string, format: uuid }
              revoked_at: { type: [string, "null"], format: date-time }
              revoked_by: { type: [string, "null"], format: uuid }
    InvoicePaymentInput:
      type: object
      required: [amount, paid_on]
      additionalProperties: false
      properties:
        amount: { type: string, pattern: "^[0-9]{1,14}(\\.[0-9]{1,2})?$", description: "groesser 0" }
        paid_on: { type: string, format: date }
        currency: { type: string, pattern: "^[A-Z]{3}$", description: "Standard: Waehrung der Einstellungen, sonst EUR" }
        method: { type: string, enum: [bank_transfer, cash, card, direct_debit, other], default: bank_transfer }
        reference: { type: [string, "null"], maxLength: 500 }
        note: { type: [string, "null"], maxLength: 5000 }
        contact_id: { type: [string, "null"], format: uuid }
    InvoiceAllocationInput:
      type: object
      required: [document_id, amount, confirmed]
      additionalProperties: false
      properties:
        document_id: { type: string, format: uuid }
        amount: { type: string, pattern: "^[0-9]{1,14}(\\.[0-9]{1,2})?$" }
        skonto_amount: { type: [string, "null"], pattern: "^[0-9]{1,14}(\\.[0-9]{1,2})?$", description: "Standard 0" }
        overpayment: { type: [boolean, "null"], description: "true erlaubt mehr als den offenen Betrag" }
        confirmed: { type: boolean, const: true }
    InvoicePaymentVoidInput:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    InvoiceAllocationSuggestion:
      type: object
      required: [document_id, document_number, open_amount, amount, skonto_amount, reasons]
      properties:
        document_id: { type: string, format: uuid }
        document_number: { type: string }
        open_amount: { type: string }
        amount: { type: string, description: "vorgeschlagener Betrag" }
        skonto_amount: { type: string }
        reasons: { type: array, items: { type: string, enum: [number_in_reference, amount_matches_open, amount_matches_skonto, same_contact] } }
    InvoiceItemInput:
      type: object
      required: [name, unit_price, tax_rate]
      additionalProperties: false
      properties:
        sku: { type: [string, "null"], maxLength: 60 }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, "null"], maxLength: 2000 }
        unit: { type: [string, "null"], maxLength: 20 }
        unit_price: { type: string, pattern: "^-?[0-9]{1,14}(\\.[0-9]{1,4})?$", description: "Dezimal-String, kein JSON-Zahlenwert" }
        price_includes_tax: { type: boolean, default: false }
        tax_rate: { type: string, pattern: "^[0-9]{1,3}(\\.[0-9]{1,4})?$", description: "0 bis 100" }
        track_stock: { type: boolean, default: false }
        stock_quantity: { type: [string, "null"] }
        active: { type: boolean, default: true }
