  # --- WP-D2: DMS-Kern (Modul dms; Modul nicht aktiv: 404 module_disabled; Berechtigungen dms.*) ---
  /api/v1/tenants/{tenant}/dms/uploads:
    post:
      operationId: dmsUpload
      summary: Datei hochladen (Berechtigung dms.document.create). Body = Dateiinhalt, gestreamt; Typ wird an den Magic Bytes erkannt (PDF, PNG, JPEG, TIFF, WebP), nicht an Endung oder Content-Type
      description: |
        Query: filename, title, doc_date (yyyy-MM-dd), document_type_id, archive (true vergibt die ASN sofort). Idempotency-Key ist Pflicht;
        gleicher Key + gleicher Inhalt/Parameter liefert die gespeicherte Antwort, anderer Inhalt 422 idempotency_key_reused.
        Ein bereits vorhandenes Original im Mandanten wird nicht abgelehnt, sondern als duplicates gemeldet.
        Zu gross 413 payload_too_large, unbekannter Typ 415 unsupported_media_type.
        Speicherquota je Mandant (Summe aller Dateien des Mandanten, Dedup zaehlt einmal; Betreiber-Einstellung DMS_TENANT_QUOTA_BYTES, Standard 1 TiB): ueberschreitet der Upload sie, 413 storage_quota_exceeded.
        Schlaegt ein Upload nach dem Speichern fehl (Validierung, Key-Konflikt, Quota), wird der Blob verworfen, sofern ihn kein Dokument referenziert. Trifft ein Upload gleichzeitig auf einen
        gerade verworfenen Blob gleicher Bytes, antwortet er 409 upload_interrupted; der Client wiederholt mit demselben Idempotency-Key.
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { name: filename, in: query, schema: { type: string, maxLength: 255 } }
        - { name: title, in: query, schema: { type: string, maxLength: 300 } }
        - { name: doc_date, in: query, schema: { type: string, format: date } }
        - { name: document_type_id, in: query, schema: { type: string, format: uuid } }
        - { name: archive, in: query, schema: { type: boolean, default: false } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Dokument angelegt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DmsDocument" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/tenants/{tenant}/dms/stats:
    get:
      operationId: getDmsStats
      summary: Dokumentzaehler fuer das Dashboard (Berechtigung dms.document.read)
      description: |
        WP-D9: Anzahl in der Warteschlange, in Quarantaene (failed_permanent), mit offenen Vorschlaegen, ueberfaellig (due_date vor today, Vertraege ausgenommen) und neu in den letzten 7 Tagen.
        Papierkorb zaehlt nie mit; alles mandantengefiltert. today (Datum, Standard: Datenbankdatum) erlaubt dem Client seinen lokalen Tag.
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
        - { name: today, in: query, schema: { type: string, format: date } }
      responses:
        "200": { description: Zaehler, content: { application/json: { schema: { $ref: "#/components/schemas/DmsStats" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/tenants/{tenant}/dms/documents:
    get:
      operationId: listDmsDocuments
      summary: Dokumente (Berechtigung dms.document.read); trashed=true zeigt den Papierkorb
      description: |
        Filter status, document_type_id, tag_id, correspondent_id, asn, q (Titel enthaelt). Cursor-Pagination wie ueberall.
        WP-D7 (Extraktion, fuer alle Dokumentarten gleich): kind (Dokumentart), kind_certain, currency (ISO, Grossbuchstaben), amount_min/amount_max (Dezimalzeichenkette, bis zwei Nachkommastellen),
        extracted_from/extracted_to (Belegdatum aus dem Text), due_from/due_to (Faelligkeit/Frist), reference (genau, Rechnungsnummer oder Aktenzeichen).
        sort = created_at (Standard), amount, extracted_date oder due_date; order = asc (Standard) oder desc. Dokumente ohne den sortierten Wert stehen immer am Ende.
        Der Cursor gilt nur fuer dieselbe Sortierung. Ungueltige Werte: 422 mit Feldname.
        WP-D9: source (Eingangsquelle), has_open_suggestions (true = mindestens ein offener Vorschlag, false = keiner); jedes Dokument traegt source und open_suggestions.
        totals=true liefert zusaetzlich totals: Summe der Betraege der gesamten gefilterten Menge (nicht nur der Seite, ohne Cursor) je Waehrung als Dezimalzeichenkette;
        Dokumente ohne Betrag zaehlen nicht, Betraege ohne Waehrung bilden eine eigene Gruppe (currency null); der Papierkorb zaehlt nur mit trashed=true.
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Count" }
        - { name: trashed, in: query, schema: { type: boolean, default: false } }
        - { name: status, in: query, schema: { type: string, enum: [processing, needs_review, archived] } }
        - { name: document_type_id, in: query, schema: { type: string, format: uuid } }
        - { name: tag_id, in: query, schema: { type: string, format: uuid } }
        - { name: correspondent_id, in: query, schema: { type: string, format: uuid } }
        - { name: asn, in: query, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: q, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { $ref: "#/components/schemas/DmsDocumentKind" } }
        - { name: kind_certain, in: query, schema: { type: boolean } }
        - { name: currency, in: query, schema: { type: string, pattern: "^[A-Z]{3}$" } }
        - { name: amount_min, in: query, schema: { type: string, pattern: "^-?[0-9]{1,13}(\\.[0-9]{1,2})?$" } }
        - { name: amount_max, in: query, schema: { type: string, pattern: "^-?[0-9]{1,13}(\\.[0-9]{1,2})?$" } }
        - { name: extracted_from, in: query, schema: { type: string, format: date } }
        - { name: extracted_to, in: query, schema: { type: string, format: date } }
        - { name: due_from, in: query, schema: { type: string, format: date } }
        - { name: due_to, in: query, schema: { type: string, format: date } }
        - { name: reference, in: query, schema: { type: string, maxLength: 100 } }
        - { name: sort, in: query, schema: { type: string, enum: [created_at, amount, extracted_date, due_date], default: created_at } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
        - { name: source, in: query, schema: { $ref: "#/components/schemas/DmsDocumentSource" } }
        - { name: has_open_suggestions, in: query, schema: { type: boolean } }
        - { name: totals, in: query, schema: { type: boolean, default: false }, description: "Summe je Waehrung der gefilterten Menge mitliefern" }
      responses:
        "200":
          description: Seite
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/DmsDocument" } }
                  next_cursor: { type: [string, "null"] }
                  total: { type: [integer, "null"] }
                  totals: { type: array, items: { $ref: "#/components/schemas/DmsCurrencyTotal" }, description: "Nur mit totals=true" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/tenants/{tenant}/dms/documents/{document}:
    get:
      operationId: getDmsDocument
      summary: Dokument mit Tags, Feldern und Dateien (Berechtigung dms.document.read); fremde ID 404
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
        - { $ref: "#/components/parameters/DmsDocument" }
      responses:
        "200":
          description: Dokument
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DmsDocument" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateDmsDocument
      summary: Metadaten aendern (Berechtigung dms.document.update); nur gesetzte Felder, null loescht doc_date, Typ, Pfad, Korrespondent; tag_ids ersetzt; fields setzt Werte je Code (null entfernt)
      description: Optional If-Match mit der rev des Dokuments (412 bei Abweichung). Dokument im Papierkorb 409 document_trashed. Korrespondent = Kontakt (Kern-links, ueberlebt Kontakt-Merge).
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
        - { $ref: "#/components/parameters/DmsDocument" }
        - { name: If-Match, in: header, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 300 }
                doc_date: { type: [string, "null"], format: date }
                document_type_id: { type: [string, "null"], format: uuid }
                storage_path_id: { type: [string, "null"], format: uuid }
                correspondent_id: { type: [string, "null"], format: uuid }
                tag_ids: { type: array, items: { type: string, format: uuid } }
                fields: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Aktualisiertes Dokument
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DmsDocument" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/tenants/{tenant}/dms/documents/{document}/archive:
    post:
      operationId: archiveDmsDocument
      summary: Archivnummer (ASN) atomar vergeben und Dokument archivieren (Berechtigung dms.document.update); idempotent, eine vorhandene ASN bleibt
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
        - { $ref: "#/components/parameters/DmsDocument" }
      responses:
        "200":
          description: Dokument
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DmsDocument" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/tenants/{tenant}/dms/documents/{document}/processing/retry:
    post:
      operationId: retryDmsDocumentProcessing
      summary: Dauerhaft fehlgeschlagene Verarbeitung (Quarantaene, failed_permanent) erneut anstossen (Berechtigung dms.document.update)
      description: |
        Setzt den Eingangsvorgang des Dokuments auf den letzten guten Zustand zurueck, reiht einen neuen OCR-Job ein (Prioritaet manuell) und schreibt einen Audit-Eintrag (dms.ingest.retried).
        Kein Body. Gibt den neuen Verarbeitungsstatus zurueck (wie GET .../processing). Ohne Quarantaene-Vorgang: 409 ingest_not_failed; Dokument im Papierkorb: 409 document_trashed;
        zwei gleichzeitige Aufrufe: genau einer wirkt, der andere erhaelt 409 ingest_not_failed. Die Ursache (z. B. verschluesseltes PDF) wird nicht behoben; scheitert der Lauf erneut, steht das Dokument wieder in Quarantaene.
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
        - { $ref: "#/components/parameters/DmsDocument" }
      responses:
        "200":
          description: Status nach dem Einreihen
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DmsProcessing" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/tenants/{tenant}/dms/documents/{document}/trash:
    post:
      operationId: trashDmsDocument
      summary: In den Papierkorb (Berechtigung dms.document.trash); Grund ist Pflicht, Original und Metadaten bleiben
      security: [{ bearer: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
        - { $ref: "#/components/parameters/DmsDocument" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200":
          description: Dokument (trashed_at gesetzt)
          content:
            application/json:
