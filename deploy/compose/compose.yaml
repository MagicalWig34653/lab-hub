# Einzelner Docker-Host ohne Swarm: Postgres + Migration + Backend. Start über deploy/setup.sh oder:
#   docker compose --env-file deploy/.env -f deploy/compose/compose.yaml up -d
# Secrets liegen als Dateien (Modus 0600) in deploy/compose/secrets/ (von setup.sh erzeugt, nicht im Git).
name: ${LABHUB_STACK:-labhub}
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-labhub}
      POSTGRES_USER: ${DB_USER:-labhub}
      POSTGRES_PASSWORD_FILE: /run/secrets/lh_db_password
    secrets: [lh_db_password]
    volumes:
      - labhub-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-labhub} -d ${DB_NAME:-labhub}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: ${LABHUB_IMAGE:?LABHUB_IMAGE setzen}
    command: ["migrate", "--env", "production"]
    depends_on:
      db: { condition: service_healthy }
    environment: &dbenv
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-labhub}
      DB_USER: ${DB_USER:-labhub}
      DB_PASSWORD_FILE: /run/secrets/lh_db_password
      DB_TLS: ${DB_TLS:-disable}
      AUTO_MIGRATE: "false"
    secrets: [lh_db_password]
    read_only: true
    tmpfs: [/tmp]
    restart: "no"

  backend:
    image: ${LABHUB_IMAGE:?LABHUB_IMAGE setzen}
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
    environment:
      <<: *dbenv
      PUBLIC_URL: ${PUBLIC_URL:?PUBLIC_URL setzen}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:?WEBAUTHN_RP_ID setzen}
      SECRET_KEY_FILE: /run/secrets/lh_secret_key
    secrets: [lh_db_password, lh_secret_key]
    read_only: true
    tmpfs: [/tmp]
    ports:
      - "${BACKEND_BIND:-127.0.0.1}:${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  # WP-O2: OCR-Worker (Dockerfile.worker). Gleiche Datenbank wie das Backend, kein Port, read-only Root, Schreiben nur nach /tmp (tmpfs).
  # Objektspeicher: wie das Backend (OBJECT_STORE*); bei OBJECT_STORE=fs muss dasselbe Volume eingehängt werden (Betriebsart mit mehreren Hosts: S3).
  worker:
    image: ${LABHUB_WORKER_IMAGE:-${LABHUB_IMAGE:?LABHUB_IMAGE setzen}-worker}
    command: ["worker", "--kinds", "dms.ocr"]
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
    environment:
      <<: *dbenv
      OCR_TMPDIR: /tmp
      OCR_TIMEOUT_SECONDS: ${OCR_TIMEOUT_SECONDS:-600}
      OCR_MEMORY_MB: ${OCR_MEMORY_MB:-4096}
      OCR_MAX_PAGES: ${OCR_MAX_PAGES:-300}
    secrets: [lh_db_password]
    read_only: true
    tmpfs: ["/tmp:size=2g"]
    stop_grace_period: 30s
    mem_limit: ${OCR_WORKER_MEMORY:-6g}
    cpus: ${OCR_WORKER_CPUS:-2.0}
    pids_limit: 512
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

secrets:
  lh_db_password:
    file: ./secrets/lh_db_password
  lh_secret_key:
    file: ./secrets/lh_secret_key
volumes:
  labhub-db:
