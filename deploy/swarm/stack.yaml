# Produktions-Stack (Entwurf): Backend mit Repliken + einmaliger Migrationsjob. Datenbank und Objektspeicher gehören
# nicht zu diesem Stack (extern oder eigener Stack). Passwörter und Schlüssel nur als Docker-Secrets (<NAME>_FILE).
# Ablauf: deploy/setup.sh erzeugt .env und Secrets; Deploy mit stack.yaml (externe DB) oder stack.yaml + stack.db.yaml
# (Postgres im Stack). Erst-Deploy mit BACKEND_REPLICAS=0, dann migrate abwarten, dann hochskalieren (macht update.sh/setup.sh).
services:
  migrate:
    image: ${LABHUB_IMAGE:?LABHUB_IMAGE setzen}
    command: ["migrate", "--env", "production"]
    environment:
      DB_HOST: ${DB_HOST:?DB_HOST setzen}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-labhub}
      DB_USER: ${DB_USER:-labhub}
      DB_PASSWORD_FILE: /run/secrets/lh_db_password
      DB_TLS: ${DB_TLS:-require}
      AUTO_MIGRATE: "false"
    secrets: [lh_db_password]
    read_only: true
    tmpfs: [/tmp]
    deploy:
      mode: replicated-job
      replicas: 1
      restart_policy: { condition: none }
      resources:
        limits: { cpus: "1.0", memory: 512M }

  backend:
    image: ${LABHUB_IMAGE:?LABHUB_IMAGE setzen}
    environment:
      DB_HOST: ${DB_HOST:?DB_HOST setzen}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-labhub}
      DB_USER: ${DB_USER:-labhub}
      DB_PASSWORD_FILE: /run/secrets/lh_db_password
      DB_TLS: ${DB_TLS:-require}
      AUTO_MIGRATE: "false"
      PUBLIC_URL: ${PUBLIC_URL:?PUBLIC_URL setzen}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:?WEBAUTHN_RP_ID setzen}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      PWA_ENABLED: ${PWA_ENABLED:-true}
      PWA_HSTS_MAX_AGE: ${PWA_HSTS_MAX_AGE:-}
      OBJECT_STORE: ${OBJECT_STORE:-db}
      HUB_REPLICAS: ${BACKEND_REPLICAS:-1}
      DMS_MAX_UPLOAD_BYTES: ${DMS_MAX_UPLOAD_BYTES:-}
      DMS_DEFAULT_RETENTION_YEARS: ${DMS_DEFAULT_RETENTION_YEARS:-}
      DMS_TENANT_QUOTA_BYTES: ${DMS_TENANT_QUOTA_BYTES:-}
      DMS_IMPORT_HOST_ALLOWLIST: ${DMS_IMPORT_HOST_ALLOWLIST:-}
      DMS_ALLOW_INTERNAL_TARGETS: ${DMS_ALLOW_INTERNAL_TARGETS:-false}
      DMS_MAIL_HOST_ALLOWLIST: ${DMS_MAIL_HOST_ALLOWLIST:-}
      DMS_MAIL_PORT_ALLOWLIST: ${DMS_MAIL_PORT_ALLOWLIST:-}
      SECRET_KEY_FILE: /run/secrets/lh_secret_key
    secrets: [lh_db_password, lh_secret_key]
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    ports:
      - { target: 8080, published: 8080, mode: host }
    deploy:
      replicas: ${BACKEND_REPLICAS:-2}
      update_config: { order: start-first, parallelism: 1, failure_action: rollback }
      rollback_config: { order: start-first }
      restart_policy: { condition: on-failure }
      resources:
        limits: { cpus: "1.0", memory: 512M }

  # WP-O2: OCR-Worker (Dockerfile.worker), UNGETESTET unter Swarm (nur Syntaxprüfung mit `docker compose config`). Wie das Backend ohne Port;
  # Repliken nach Last (jeder Worker holt Aufträge per Lease aus der Datenbank, mehrere sind sicher, ADR 0006). Objektspeicher wie das Backend (S3 empfohlen).
  worker:
    image: ${LABHUB_WORKER_IMAGE:-${LABHUB_IMAGE:?LABHUB_IMAGE setzen}-worker}
    # WP-D4 (UNGETESTET unter Swarm, nur Syntax): Prüf-/Export-Jobs, Mail-Poll und Konsumordner. Der Konsumordner (Volume) hängt nur am Worker; im Swarm braucht er ein Volume,
    # das auf jedem Knoten mit Worker-Replik dieselben Dateien zeigt (NFS o. ä.) oder die Worker-Replik an einen Knoten binden (placement constraint, Knoten-Label).
    command: ["worker", "--kinds", "dms.ocr,dms.verify,dms.export,dms.mail.poll,dms.folder.scan,dms.import.paperless"]
    volumes:
      - ${DMS_FOLDER_SOURCE:-labhub-consume}:/mnt/consume
      # WP-D6: Export-Verzeichnisse für den Paperless-Import, nur lesend: <DMS_IMPORT_ROOT>/<mandanten-uuid>/<Pfad>
      - ${DMS_IMPORT_SOURCE:-labhub-import}:/mnt/import:ro
    environment:
      SECRET_KEY_FILE: /run/secrets/lh_secret_key
      DMS_FOLDER_ROOT: /mnt/consume
      DMS_IMPORT_ROOT: /mnt/import
      DMS_IMPORT_HOST_ALLOWLIST: ${DMS_IMPORT_HOST_ALLOWLIST:-}
      DMS_ALLOW_INTERNAL_TARGETS: ${DMS_ALLOW_INTERNAL_TARGETS:-false}
      DMS_MAIL_TLS_VERIFY: ${DMS_MAIL_TLS_VERIFY:-true}
      DMS_MAIL_CA_PATH: ${DMS_MAIL_CA_PATH:-}
      DMS_MAIL_HOST_ALLOWLIST: ${DMS_MAIL_HOST_ALLOWLIST:-}
      DMS_MAIL_PORT_ALLOWLIST: ${DMS_MAIL_PORT_ALLOWLIST:-}
      DMS_TENANT_QUOTA_BYTES: ${DMS_TENANT_QUOTA_BYTES:-}
      DMS_DEFAULT_RETENTION_YEARS: ${DMS_DEFAULT_RETENTION_YEARS:-}
      DB_HOST: ${DB_HOST:?DB_HOST setzen}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-labhub}
      DB_USER: ${DB_USER:-labhub}
      DB_PASSWORD_FILE: /run/secrets/lh_db_password
      DB_TLS: ${DB_TLS:-require}
      AUTO_MIGRATE: "false"
      OCR_TMPDIR: /tmp
      OCR_TIMEOUT_SECONDS: ${OCR_TIMEOUT_SECONDS:-600}
      OCR_MEMORY_MB: ${OCR_MEMORY_MB:-4096}
      OCR_MAX_PAGES: ${OCR_MAX_PAGES:-300}
    secrets: [lh_db_password, lh_secret_key]
    read_only: true
    tmpfs: ["/tmp:size=2g"]
    stop_grace_period: 30s
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
      update_config: { order: stop-first, parallelism: 1, failure_action: rollback }
      restart_policy: { condition: on-failure }
      resources:
        limits: { cpus: "2.0", memory: 6G }

secrets:
  lh_db_password:
    external: true
  lh_secret_key:
    external: true
volumes:
  labhub-consume:
  labhub-import:
